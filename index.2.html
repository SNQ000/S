عد تحتاجه؛ لازم تحذفه بنفسك."},{"sec":"S4 · تجميعات","page":62,"n":"13","q":"In Microsoft word 2021, _____________ are powerful tools that transform your documents into interactive and user-friendly resources.","o":{"a":"bookmarks","b":"comments","c":"tables","d":"hyperlinks"},"a":"d","e":"Hyperlinks (الروابط) أدوات قوية تحول المستند إلى مورد تفاعلي سهل الاستخدام. Bookmarks وComments وTables لا تحقق ذلك."},{"sec":"S4 · تجميعات","page":62,"n":"14","q":"In Microsoft Word, _____________ are notes or annotations that can be inserted into a document without changing the main text.","o":{"a":"bookmarks","b":"charts","c":"comments","d":"shapes"},"a":"c","e":"Comments (التعليقات) ملاحظات أو شروح تُضاف للمستند بدون تغيير النص الأساسي. Bookmarks للتنقل، وCharts وShapes عناصر رسومية."},{"sec":"S4 · تجميعات","page":62,"n":"15","q":"In Word 2021, comments can be added to any part of the document, including text, images, or tables.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تضيف تعليقات على أي جزء مثل النص أو الصور أو الجداول."},{"sec":"S4 · تجميعات","page":62,"n":"16","q":"In Word 2021, you can view individual or all comments in the document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تعرض تعليقاً واحداً أو كل التعليقات في المستند."},{"sec":"S4 · تجميعات","page":63,"n":"17","q":"In Word 2021, you can reply to a comment to provide feedback or clarification.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر ترد على تعليق لتعطي ملاحظة أو توضيحاً."},{"sec":"S4 · تجميعات","page":63,"n":"18","q":"In Word 2021, you can use the _____________ feature to mention a specific person in a comment.","o":{"a":"comments","b":"hyperlinks","c":"@","d":"#"},"a":"c","e":"الرمز @ يُستخدم لذكر شخص معين في تعليق. # وHyperlinks لا تستخدم لذلك."},{"sec":"S4 · تجميعات","page":63,"n":"19","q":"In Microsoft Word 2021, comments cannot be deleted if they are no longer needed.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تحذف التعليقات التي لم تعد تحتاجها."},{"sec":"S4 · تجميعات","page":63,"n":"20","q":"_____________ is the process of carefully reviewing and checking a document for errors in spelling, grammar, punctuation, and overall readability.","o":{"a":"Grammar","b":"Translation","c":"Track Changes","d":"Proofreading"},"a":"d","e":"Proofreading (التدقيق) هو مراجعة المستند بعناية للتأكد من خلوه من أخطاء الإملاء والقواعد والترقيم ووضوح القراءة. Track Changes لتتبع التعديلات."},{"sec":"S4 · تجميعات","page":63,"n":"21","q":"Word automatically underlines any misspelled words with a _____________ as you type.","o":{"a":"@","b":"Red Wavy Underline","c":"Column","d":"Double Blue Underline"},"a":"b","e":"Word يضع تلقائياً خطاً أحمر متعرجاً (Red Wavy Underline) تحت الكلمات المكتوبة خطأ إملائياً."},{"sec":"S4 · تجميعات","page":64,"n":"22","q":"Grammar errors, such as incorrect punctuation, sentence fragments, or subject- verb agreement issues, are highlighted with a _____________.","o":{"a":"@","b":"Red Wavy Underline","c":"Column","d":"Double Blue Underline"},"a":"d","e":"الأخطاء النحوية تظهر بخط أزرق مزدوج (Double Blue Underline). الخط الأحمر المتعرج للأخطاء الإملائية."},{"sec":"S4 · تجميعات","page":64,"n":"23","q":"In Microsoft Word, the _____________ is a feature that helps you to find words with similar meanings (synonyms).","o":{"a":"Thesaurus","b":"Language","c":"Translation","d":"Track Changes"},"a":"a","e":"Thesaurus (قاموس المرادفات) يساعدك تجد كلمات بمعانٍ مشابهة. Language وTranslation للغات والترجمة، وTrack Changes لتتبع التعديلات."},{"sec":"S4 · تجميعات","page":64,"n":"24","q":"In Microsoft Word 2021, the Language and Translation tools assist you in working with various languages, whether you're proofreading for spelling and grammar or translating content.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أدوات Language وTranslation تساعد في العمل بلغات متعددة، سواء للتدقيق أو الترجمة."},{"sec":"S4 · تجميعات","page":64,"n":"25","q":"In Microsoft Word 2021, the Language feature allows you to easily translate text from one language to another within the document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن ترجمة النص من لغة لأخرى تفعلها ميزة Translation، أما Language فتتعلق بإعدادات اللغة والتدقيق."},{"sec":"S4 · تجميعات","page":65,"n":"26","q":"In Word 2021, the feature _____________ is especially useful when you need Word to check spelling and grammar in a specific language.","o":{"a":"Translate","b":"Autocorrect","c":"Thesaurus","d":"Set Proofing Language"},"a":"d","e":"Set Proofing Language مفيد عندما تريد من Word أن يدقق الإملاء والقواعد بلغة معينة. Translate للترجمة، وThesaurus للمرادفات."},{"sec":"S4 · تجميعات","page":65,"n":"27","q":"In Microsoft Word 2021, you cannot protect your document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Word 2021 يتيح حماية المستند (مثل التشفير بكلمة مرور وتقييد التحرير)."},{"sec":"S4 · تجميعات","page":65,"n":"28","q":"Encrypting a document with a password allows others to view it without a password.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن التشفير بكلمة مرور يمنع الآخرين من فتح المستند بدون الكلمة."},{"sec":"S4 · تجميعات","page":65,"n":"29","q":"In Microsoft Word, you can remove the encryption if you no longer want to protect your document with a password.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تزيل التشفير إذا لم تعد تريد حماية المستند بكلمة مرور."},{"sec":"S4 · تجميعات","page":65,"n":"30","q":"In Microsoft Word, you cannot remove the encryption.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تزيل التشفير."},{"sec":"S4 · تجميعات","page":65,"n":"31","q":"In Microsoft Word 2021, _____________ a document means saving or converting it into a different file format","o":{"a":"saving","b":"printing","c":"exporting","d":"opening"},"a":"c","e":"Exporting (التصدير) هو حفظ المستند أو تحويله إلى صيغة ملف مختلفة. Saving حفظ، وPrinting طباعة، وOpening فتح."},{"sec":"S4 · تدريبات","page":67,"n":"1","q":"Microsoft Word 2021 offers a comprehensive suite of tools to manage and format references efficiently","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word 2021 يوفر مجموعة أدوات لإدارة المراجع وتنسيقها بكفاءة."},{"sec":"S4 · تدريبات","page":67,"n":"2","q":"The main difference between Footnote and Endnote is where they appear in the document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الفرق الرئيسي بين Footnote وEndnote هو مكان ظهورهما في المستند (أسفل الصفحة أو نهاية المستند)."},{"sec":"S4 · تدريبات","page":67,"n":"3","q":"When you insert a Table of Contents, it automatically updates if you add new headings to the document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن جدول المحتويات لا يتحدث تلقائياً عند إضافة عناوين جديدة؛ تحتاج تنفيذ Update Table."},{"sec":"S4 · تدريبات","page":67,"n":"4","q":"In Word 2021, you cannot hyperlink an image.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تضيف رابطاً (Hyperlink) إلى صورة في Word 2021."},{"sec":"S4 · تدريبات","page":67,"n":"5","q":"In Word, you can remove hyperlink by _____________ on the hyperlink you want to remove.","o":{"a":"left click","b":"double click","c":"single click","d":"right click"},"a":"d","e":"لإزالة الرابط نضغط بزر الفأرة الأيمن (right click) على الرابط ثم نختار Remove Hyperlink."},{"sec":"S4 · تدريبات","page":67,"n":"6","q":"Deleting a comment does not remove it from the document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن حذف التعليق يزيله من المستند."},{"sec":"S4 · تدريبات","page":68,"n":"7","q":"In Microsoft Word, you can easily check and improve the grammar and spelling of your document using its built-in tools.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word فيه أدوات مدمجة لفحص وتحسين القواعد والإملاء."},{"sec":"S4 · تدريبات","page":68,"n":"8","q":"In Microsoft Word 2021, the _____________ feature allows you to easily translate text from one language to another within the document.","o":{"a":"Language","b":"Table of Contents","c":"Translation","d":"Track Changes"},"a":"c","e":"Translation هي الميزة التي تترجم النص من لغة لأخرى داخل المستند. Language لإعدادات اللغة، وTOC وTrack Changes لوظائف مختلفة."},{"sec":"S4 · تدريبات","page":68,"n":"9","q":"In Word, you can translate selected text or even entire documents.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تترجم نصاً محدداً أو المستند كاملاً."},{"sec":"S4 · تدريبات","page":68,"n":"10","q":"In Microsoft Word 2021, ______________ is a tool that enables you to edit a document while keeping a detailed record of all changes.","o":{"a":"Exporting","b":"Gemini","c":"Track Changes","d":"Language"},"a":"c","e":"Track Changes (تتبع التغييرات) يتيح لك تعديل المستند مع الاحتفاظ بسجل مفصل لكل التغييرات. Exporting للتصدير، وLanguage للغات."},{"sec":"S4 · تدريبات","page":68,"n":"11","q":"In Word, when Track Changes is enabled, all insertions, deletions, formatting changes, and comments are highlighted,","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: عند تفعيل Track Changes يتم تمييز كل الإضافات والحذف وتغييرات التنسيق والتعليقات."},{"sec":"S4 · تدريبات","page":69,"n":"12","q":"In Word, the _____________ feature gives you control over who can edit the document and the types of changes they can make.","o":{"a":"Password","b":"Prompt","c":"Thesaurus","d":"Restrict Editing"},"a":"d","e":"ميزة Restrict Editing تتحكم في من يستطيع تعديل المستند ونوع التغييرات المسموحة. Password كلمة مرور، وThesaurus مرادفات، وPrompt ليس ميزة في Word."},{"sec":"S4 · تدريبات","page":69,"n":"13","q":"Microsoft Copilot is a tool integrated into Microsoft Word, designed to assist with creating, editing, and managing documents.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Microsoft Copilot أداة مدمجة في Word تساعد في إنشاء المستندات وتحريرها وإدارتها."},{"sec":"S4 · تدريبات","page":69,"n":"14","q":"In Word, Microsoft Copilot uses Artificial Intelligence to generate text, summarize content, and enhancing grammar to streamline writing.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: يستخدم Copilot الذكاء الاصطناعي لتوليد النص وتلخيص المحتوى وتحسين القواعد."},{"sec":"S4 · تدريبات","page":69,"n":"15","q":"_____________ are instructions given to Copilot to make it perform more efficiently.","o":{"a":"Referencing","b":"Prompts","c":"Icon","d":"Translation"},"a":"b","e":"Prompts هي التعليمات التي تعطيها لـCopilot ليؤدي بكفاءة أكبر. Referencing وIcon وTranslation ليست التعليمات المعطاة له."},{"sec":"S4 · تدريبات","page":69,"n":"16","q":"The _____________ icon within a Word document is designed to assist with editing and creation tasks.","o":{"a":"Search","b":"Copilot","c":"Styles","d":"Font color"},"a":"b","e":"أيقونة Copilot داخل Word مصممة للمساعدة في التحرير وإنشاء المحتوى. Search وStyles وFont color لها وظائف أخرى."}];
const $=id=>document.getElementById(id);
const secs=[...new Set(Q.map(x=>x.sec))];
let base=[],run=[],i=0,ans=[],cur="start",sel=null;
function show(id,dir){
  if(id===cur)return;
  document.documentElement.style.setProperty("--dx",(dir||1)*-24+"px");
  const from=$(cur),to=$(id);cur=id;
  from.classList.add("out");
  setTimeout(()=>{from.classList.add("hidden");from.classList.remove("out","in");
    to.classList.remove("hidden","in");void to.offsetWidth;to.classList.add("in");window.scrollTo(0,0)},200);
}
const done=()=>ans.filter(Boolean);
const okCount=()=>done().filter(r=>r.ok).length;

function home(){
  show("start",-1);
  $("intro").textContent="اضغط على القسم اللي تبي تحله. تعرف إذا إجابتك صح أو غلط مباشرة مع الشرح، وتقدر ترجع للأسئلة السابقة، والمجموع يطلع في النهاية.";
  const c=$("secs");c.innerHTML="";
  const mk=(label,list,k,cls)=>{
    const b=document.createElement("button");b.className="sec "+(cls||"");b.style.setProperty("--i",k);
    const l=document.createElement("span");l.textContent=label;const n=document.createElement("small");n.textContent=list.length+" سؤال";
    b.append(l,n);b.onclick=()=>{b.classList.add("tap");setTimeout(()=>{base=list;begin(list)},160)};return b};
  c.append(mk("كل الأقسام",Q,0,"all"));
  secs.forEach((s,k)=>c.append(mk(s,Q.filter(x=>x.sec===s),k+1)));
}
function begin(list){run=list;i=0;ans=new Array(list.length).fill(null);show("quiz",1);buildDots();render()}
function buildDots(){
  const d=$("dots");d.innerHTML="";
  run.forEach((_,k)=>{const b=document.createElement("button");b.setAttribute("aria-label","سؤال "+(k+1));b.onclick=()=>{i=k;render()};d.append(b)});
}
function paintDots(){
  [...$("dots").children].forEach((b,k)=>{const a=ans[k];b.className=(a?(a.ok?"ok":"bad"):"")+(k===i?" cur":"")});
}
function render(){
  const q=run[i],a=ans[i];sel=null;
  $("pos").textContent=(i+1)+" / "+run.length;
  $("sc").textContent="الصحيح: "+okCount();
  $("pb").style.width=(done().length/run.length*100)+"%";
  $("meta").textContent=q.sec+" · سؤال "+q.n+" · ص "+q.page;
  $("qt").textContent=q.q;
  const im=$("qimg");if(q.img){im.src=q.img;im.classList.remove("hidden")}else{im.classList.add("hidden");im.removeAttribute("src")}
  const o=$("opts");o.innerHTML="";
  Object.keys(q.o).forEach(k=>{
    const b=document.createElement("button");b.className="opt";b.dataset.k=k;
    const l=document.createElement("b");l.textContent=k;const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>pick(k);o.append(b);
  });
  paintAnswer();
  $("confirm").classList.toggle("hidden",!!a);$("confirm").disabled=true;
  $("prev").disabled=i===0;
  $("next").textContent=i===run.length-1?"عرض النتيجة":"التالي";
  $("next").disabled=!a;
  paintDots();
  window.scrollTo(0,0);
}
function paintAnswer(){
  const q=run[i],a=ans[i],f=$("fb");
  if(!a){f.className="fb hidden";f.innerHTML="";return}
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k===q.a)b.classList.add("ok");else if(b.dataset.k===a.pick)b.classList.add("bad")});
  f.className="fb "+(a.ok?"ok":"bad");f.innerHTML="";
  const h=document.createElement("div");
  h.textContent=a.ok?"صح ✓":"غلط ✗ — إجابتك ("+a.pick.toUpperCase()+") مو صحيحة، والصحيح ("+q.a.toUpperCase()+"): "+q.o[q.a];
  const e=document.createElement("div");e.className="ex";
  const s=document.createElement("strong");s.textContent=a.ok?"الشرح":"ليش؟";
  e.append(s,q.e);f.append(h,e);
}
function pick(k){
  if(ans[i])return;
  sel=k;
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b.dataset.k===k));
  $("confirm").disabled=false;
}
function confirmAns(){
  if(ans[i]||!sel)return;
  ans[i]={pick:sel,ok:sel===run[i].a};sel=null;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.classList.remove("sel")});
  paintAnswer();
  $("confirm").classList.add("hidden");
  $("sc").textContent="الصحيح: "+okCount();
  $("pb").style.width=(done().length/run.length*100)+"%";
  $("next").disabled=false;paintDots();
  $("fb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){if(i<run.length-1){i++;render()}else finish()}
function prev(){if(i>0){i--;render()}}
function finish(){
  show("end",1);
  const r=run.map((q,k)=>ans[k]?{q,pick:ans[k].pick,ok:ans[k].ok}:null).filter(Boolean);
  const s=r.filter(x=>x.ok).length,t=r.length;
  $("fin").textContent=s+" / "+t;
  $("pct").textContent=t?Math.round(s/t*100)+"%"+(t<run.length?" (أنهيت قبل آخر الأسئلة)":""):"ما أجبت على أي سؤال";
  const b=$("brk");b.innerHTML="";
  secs.forEach(sc=>{const x=r.filter(y=>y.q.sec===sc);if(!x.length)return;
    const d=document.createElement("div");d.className="row";
    const a=document.createElement("span");a.textContent=sc;const c=document.createElement("b");c.textContent=x.filter(y=>y.ok).length+" / "+x.length;
    d.append(a,c);b.append(d)});
  const bad=r.filter(x=>!x.ok),w=$("wrong");w.innerHTML="";
  $("wrongWrap").classList.toggle("hidden",!bad.length);$("redo").classList.toggle("hidden",!bad.length);
  bad.forEach(x=>{const d=document.createElement("div");d.className="rev";
    const q=document.createElement("p");q.className="q";q.textContent=x.q.n+". "+x.q.q;
    const y=document.createElement("div");y.style.color="var(--bad)";y.textContent="إجابتك: "+x.pick+". "+x.q.o[x.pick];
    const g=document.createElement("div");g.style.color="var(--ok)";g.textContent="الصحيح: "+x.q.a+". "+x.q.o[x.q.a];
    const e=document.createElement("div");e.className="ex";e.style.direction="rtl";e.style.textAlign="right";e.textContent=x.q.e;
    d.append(q,y,g,e);w.append(d)});
  window.__wrong=bad.map(x=>x.q);
}
$("confirm").onclick=confirmAns;$("next").onclick=next;$("prev").onclick=prev;
$("stop").onclick=()=>done().length?finish():home();
$("home").onclick=()=>{if(!done().length||confirm("ترجع للقائمة؟ بتضيع إجاباتك الحالية."))home()};
$("again").onclick=()=>begin(base);
$("redo").onclick=()=>begin(window.__wrong);
$("menu").onclick=home;
home();
</script>
</body>
</html>
