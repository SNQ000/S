<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الفصل الأول – Word</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#EDF1F5;--card:#fff;--ink:#16233B;--mute:#5B6A82;--line:#D5DDE7;--accent:#2F5BEA;--accent-ink:#fff;--ok:#16794F;--ok-bg:#DDF3E8;--bad:#B8322A;--bad-bg:#FBE3E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1624;--card:#18223A;--ink:#E7ECF6;--mute:#9AA9C4;--line:#2B3858;--accent:#6E8FFF;--accent-ink:#0B1226;--ok:#5FD19A;--ok-bg:#12372A;--bad:#FF8B82;--bad-bg:#3E1D1B}}
:root[data-theme="dark"]{--bg:#0F1624;--card:#18223A;--ink:#E7ECF6;--mute:#9AA9C4;--line:#2B3858;--accent:#6E8FFF;--accent-ink:#0B1226;--ok:#5FD19A;--ok-bg:#12372A;--bad:#FF8B82;--bad-bg:#3E1D1B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;line-height:1.3;margin:8px 0 6px}
h2{font-size:18px;margin:22px 0 10px}
p{margin:0 0 10px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-weight:400;opacity:.8;margin-inline-start:4px}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;color:var(--mute)}
.top .sp{flex:1}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.meta{font-size:13px;color:var(--mute);margin-bottom:8px}
.q{direction:ltr;text-align:left;font:600 18px/1.55 "IBM Plex Sans",system-ui,sans-serif;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{direction:ltr;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-wrap:anywhere}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;text-transform:uppercase}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok b{background:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad b{background:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.score{font-size:56px;font-weight:700;line-height:1.1;margin:6px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.rev{direction:ltr;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border:0}
.rev .q{font-size:15px;margin-bottom:6px}
.rev div{font-size:14px}
.stack{display:grid;gap:10px;margin-top:16px}
.qimg{display:block;max-width:150px;max-height:110px;margin:0 0 14px;border-radius:8px;background:#fff;padding:6px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.sel b{background:var(--accent);color:var(--accent-ink)}
:root{--dx:-24px}
.view.in{animation:vin .34s cubic-bezier(.2,.8,.2,1) both}
.view.out{animation:vout .2s ease-in both}
@keyframes vin{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@keyframes vout{to{opacity:0;transform:translateX(calc(var(--dx) * -1))}}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:16px;margin-bottom:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:right;font-weight:600;font-size:17px;animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 50ms);transition:transform .15s,border-color .15s}
.sec:hover{border-color:var(--accent)}
.sec small{color:var(--mute);font-weight:400;font-size:14px}
.sec.tap{transform:scale(.96);border-color:var(--accent)}
.sec.all{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec.all small{color:var(--accent-ink);opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.nav .btn{margin:0}
.ex{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--bg);font-weight:400;line-height:1.8;color:var(--ink)}
.ex strong{display:block;margin-bottom:2px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.dots button{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);background:var(--card);padding:0}
.dots button.ok{background:var(--ok);border-color:var(--ok)}
.dots button.bad{background:var(--bad);border-color:var(--bad)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.bar i,.sec{transition:none}.view.in,.view.out,.sec{animation:none}}
</style>
</head>
<body>
<main>
<section class="view" id="start">
  <h1>اختبار الفصل الأول – Word</h1>
  <p id="intro"></p>
  <h2>اختر القسم</h2>
  <div id="secs"></div>
</section>

<section class="view hidden" id="quiz">
  <div class="top"><button class="mini" id="home">القائمة</button><span id="pos"></span><span class="sp"></span><span id="sc"></span><button class="mini" id="stop">إنهاء</button></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="dots" id="dots"></div>
  <div class="card">
    <div class="meta" id="meta"></div>
    <p class="q" id="qt"></p>
    <img class="qimg hidden" id="qimg" alt="">
    <div class="opts" id="opts"></div>
    <div class="fb hidden" id="fb" role="status" aria-live="polite"></div>
  </div>
  <div class="stack"><button class="btn" id="confirm" disabled>تأكيد الإجابة</button></div>
  <div class="nav"><button class="btn ghost" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
</section>

<section class="view hidden" id="end">
  <div class="card">
    <p>نتيجتك</p>
    <div class="score" id="fin"></div>
    <p id="pct"></p>
  </div>
  <h2>النتيجة حسب القسم</h2>
  <div class="card" id="brk"></div>
  <div id="wrongWrap">
    <h2>الأسئلة اللي أخطأت فيها</h2>
    <div class="card" id="wrong"></div>
  </div>
  <div class="stack">
    <button class="btn" id="again">إعادة الاختبار</button>
    <button class="btn ghost" id="redo">حل الأخطاء فقط</button>
    <button class="btn ghost" id="menu">القائمة الرئيسية</button>
  </div>
</section>
</main>
<script>
const Q=[{"sec":"S1 · تجميعات","page":5,"n":"1","q":"Computing involves, using computers to perform tasks like solving problems, storing information and processing data.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الحوسبة (Computing) هي استخدام الحاسوب لأداء مهام مثل حل المشكلات وتخزين المعلومات ومعالجة البيانات."},{"sec":"S1 · تجميعات","page":5,"n":"2","q":"A ____________ is an electronic device that receives data and instructions as input from the user, processes the data based on these instructions, and produces the desired output.","o":{"a":"processor","b":"hard Disk","c":"computer","d":"motherboard"},"a":"c","e":"Computer (الحاسوب) هو الجهاز الإلكتروني الذي يستقبل البيانات والتعليمات، ويعالجها، ويخرج النتيجة. Processor وHard Disk وMotherboard أجزاء داخله فقط."},{"sec":"S1 · تجميعات","page":5,"n":"3","q":"High Processing Speed is one of the characteristics of computers.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: سرعة المعالجة العالية من خصائص الحاسوب."},{"sec":"S1 · تجميعات","page":5,"n":"4","q":"Storage Capacity is one of the characteristics of computers.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: سعة التخزين من خصائص الحاسوب."},{"sec":"S1 · تجميعات","page":5,"n":"5","q":"Versatility is one of the characteristics of computers.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تعدد الاستخدامات (Versatility) من خصائص الحاسوب."},{"sec":"S1 · تجميعات","page":5,"n":"6","q":"Automation is one of the characteristics of computers.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الأتمتة (Automation) من خصائص الحاسوب."},{"sec":"S1 · تجميعات","page":6,"n":"7","q":"Accuracy is one of the characteristics of computers.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الدقة (Accuracy) من خصائص الحاسوب."},{"sec":"S1 · تجميعات","page":6,"n":"8","q":"Which of the following is not a characteristic of computers?","o":{"a":"High Processing Speed","b":"Versatility","c":"Automation","d":"Inaccuracy"},"a":"d","e":"Inaccuracy تعني عدم الدقة، وهي ليست خاصية للحاسوب لأنه دقيق. أما السرعة وتعدد الاستخدامات والأتمتة فكلها خصائص صحيحة."},{"sec":"S1 · تجميعات","page":6,"n":"9","q":"______________ is whatever the result is generated by the computer is 100% right as per the instruction.","o":{"a":"Automation","b":"Accuracy","c":"Versatility","d":"Storage Capacity"},"a":"b","e":"Accuracy (الدقة) تعني أن نتيجة الحاسوب صحيحة 100% بحسب التعليمات. Automation تعني التشغيل بدون تدخل بشري، وVersatility تعدد الاستخدامات، وStorage Capacity سعة التخزين."},{"sec":"S1 · تجميعات","page":6,"n":"10","q":"What is the purpose of a computer?","o":{"a":"To produce heat","b":"To store physical","c":"Processes data and produces the desired output","d":"To produce electricity"},"a":"c","e":"غرض الحاسوب أنه يعالج البيانات وينتج المخرجات المطلوبة. باقي الخيارات (حرارة، كهرباء، تخزين مادي) ليست غرضه."},{"sec":"S1 · تجميعات","page":6,"n":"11","q":"A computer system consists of two main components: ____________, which together make up a complete system.","o":{"a":"input & motherboard","b":"output & CPU","c":"input & output","d":"hardware & software"},"a":"d","e":"نظام الحاسوب يتكون من مكونين رئيسيين: Hardware (المكونات المادية) وSoftware (البرامج). الإدخال والإخراج جزء من العتاد فقط."},{"sec":"S1 · تجميعات","page":6,"n":"12","q":"Which two main components make up a complete computer system?","o":{"a":"Printer & Software","b":"Monitor & Mouse","c":"CPU & Keyboard","d":"Hardware & Software"},"a":"d","e":"المكونان الرئيسيان هما Hardware وSoftware. الطابعة والفأرة والـCPU ولوحة المفاتيح كلها مكونات مادية فقط."},{"sec":"S1 · تجميعات","page":7,"n":"13","q":"Computer hardware refers to the physical components of a computer system that work together to perform various tasks.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: العتاد (Hardware) هو الأجزاء المادية التي تعمل معاً لتنفيذ المهام."},{"sec":"S1 · تجميعات","page":7,"n":"14","q":"The physical components that take input (data and instructions) from the user and then supply it to the processor are called _____________ devices.","o":{"a":"processing","b":"storage","c":"output","d":"input"},"a":"d","e":"أجهزة الإدخال (input) هي المكونات المادية التي تأخذ البيانات والتعليمات من المستخدم وتعطيها للمعالج."},{"sec":"S1 · تجميعات","page":7,"n":"15","q":"Which of the following is an output device?","o":{"a":"Scanner","b":"Printer","c":"Keyboard","d":"Mouse"},"a":"b","e":"الطابعة (Printer) جهاز إخراج لأنها تطبع نتائج الحاسوب. الماسح الضوئي والفأرة ولوحة المفاتيح أجهزة إدخال."},{"sec":"S1 · تجميعات","page":7,"n":"16","q":"Which of the following is not an input device?","o":{"a":"Mouse","b":"Scanner","c":"Projector","d":"Keyboard"},"a":"c","e":"Projector (جهاز العرض) جهاز إخراج وليس إدخال. الفأرة والماسح الضوئي ولوحة المفاتيح أجهزة إدخال."},{"sec":"S1 · تجميعات","page":7,"n":"17","q":"Which of the following is an input device?","o":{"a":"Headphone","b":"Printer","c":"Speaker","d":"Microphone"},"a":"d","e":"Microphone (الميكروفون) جهاز إدخال لأنه يدخل الصوت للحاسوب. السماعات والطابعة أجهزة إخراج."},{"sec":"S1 · تجميعات","page":7,"n":"18","q":"Scanner is considered to be an output device.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن الماسح الضوئي (Scanner) جهاز إدخال، فهو يدخل الصور والمستندات للحاسوب."},{"sec":"S1 · تجميعات","page":8,"n":"19","q":"The CPU often referred to as the ____________ of the computer.","o":{"a":"backbone","b":"brain","c":"wall","d":"heart"},"a":"b","e":"الـCPU يسمى «دماغ» الحاسوب (brain) لأنه يعالج البيانات ويتحكم في العمل. أما القلب فتسمية اللوحة الأم."},{"sec":"S1 · تجميعات","page":8,"n":"20","q":"The CPU consists of two key components: ALU & ____________","o":{"a":"Motherboard","b":"ROM","c":"Memory","d":"CU"},"a":"d","e":"الـCPU يتكون من ALU (الحساب والمنطق) وCU (وحدة التحكم). Motherboard وROM وMemory ليست من مكوناته الأساسية."},{"sec":"S1 · تجميعات","page":8,"n":"21","q":"The _____________ performs arithmetic operations such as addition, subtraction, multiplication, and division, as well as logical comparisons.","o":{"a":"CU","b":"RAM","c":"Motherboard","d":"ALU"},"a":"d","e":"الـALU (وحدة الحساب والمنطق) تقوم بالعمليات الحسابية مثل الجمع والطرح والضرب والقسمة، والمقارنات المنطقية. CU تتحكم، وRAM ذاكرة."},{"sec":"S1 · تجميعات","page":8,"n":"22","q":"It is known as the Heart of the computer:","o":{"a":"Operating System","b":"Memory","c":"Motherboard","d":"Central Processing Unit"},"a":"c","e":"اللوحة الأم (Motherboard) تسمى «قلب» الحاسوب لأنها تربط كل المكونات. أما الـCPU فهو «الدماغ»."},{"sec":"S1 · تجميعات","page":9,"n":"23","q":"Which of the following is an example of secondary memory?","o":{"a":"ALU","b":"Hard disk","c":"RAM","d":"ROM"},"a":"b","e":"Hard disk ذاكرة ثانوية للتخزين الدائم. الـALU جزء من المعالج، والـRAM والـROM ذاكرة أولية."},{"sec":"S1 · تجميعات","page":9,"n":"24","q":"An example of Secondary memory is SSD.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: SSD مثال على الذاكرة الثانوية (تخزين دائم)."},{"sec":"S1 · تجميعات","page":9,"n":"25","q":"The following image represents a type of memory. Which of the following is it?","o":{"a":"ROM","b":"Compact disc","c":"RAM","d":"Hard disk"},"a":"a","e":"الصورة شريحة ذاكرة ROM. القرص المدمج والقرص الصلب مختلفان في الشكل، وشريحة RAM تكون على شكل شريحة صغيرة على لوحة.","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAO8AAABlCAIAAAAqOSNQAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42sy9W5Mt2XEe9mXmWlV7d/e5n5nBAARxIQIDCIQo2g8kH2zJli2HHLLsF4eeRDJC4Qf9JNl6sIywZDksUopQyCGJsmxGyA5LtiUGSIGCgLkAc25z+rLvVbVWXvywavfpc+bMcEBCtvo8dJ/uqtp1yZX55ZdfZlFE4N++r3ZO9Ifa193dXUSI6KdyMmbm7swsIp/yoaqaRIj5J/xc/9hF82e4PXHcHoA73CMIjAgEiCQC7o4AMd+8Fe4OgJmBiPAg8PE2BwAEzT9cXwO9+hzieKL0utOKOG5CNy7JCX7jyK8+mkAAQR//LCAiIoKIPstdTfi38ivMIoI/1SKv1+Grt+b49dp959t93Dci+GX7+6Tb90lncjygtz3pE7a5ubuZEREz/yFvTgRgzZoCATiBEpGDzDzciCKaZQPcNotol0BE7h4RRNfugvDiG33MiXzsggiE62sNgAIxm+FLN43oes1Fu31EQa/1nfTaZXO87Z/dO/zbas0RHkHHZ/AppvyaHU098Cl+tNnrpx/nlRvKn+Bxb+xORESfvNkNp3hzr+OzPv6AwGd5dgG4GyKI6LgoqJlDBIICaAvy1fNpp9F+OZvJdUiIV66LCNEOh ars only.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن الوضع الداكن في Word 2021 يطبق على المستند كله وليس الشريط وأدوات القوائم فقط."},{"sec":"S1 · تجميعات","page":14,"n":"51","q":"In MS Word 2021, _____________ highlights one line at a time, helping users focus by reducing distractions and making it easier to read and edit long documents.","o":{"a":"Search Box","b":"PDF Editing","c":"Dark Mode","d":"Line Focus Mode"},"a":"d","e":"Line Focus Mode يبرز سطراً واحداً في كل مرة لتقليل التشتت وتسهيل قراءة المستندات الطويلة وتحريرها. Dark Mode يغير الألوان فقط."},{"sec":"S1 · تجميعات","page":14,"n":"52","q":"Which of the following is one of popular word processors?","o":{"a":"Apple Pages","b":"Hotel Management Software","c":"Windows","d":"macOS"},"a":"a","e":"Apple Pages من معالجات النصوص المعروفة. Hotel Management Software برنامج خاص الغرض، وWindows وmacOS أنظمة تشغيل."},{"sec":"S1 · تجميعات","page":14,"n":"53","q":"In MS Word 2021, the _____________ is the main space where you create and edit your document, located in the center of the screen.","o":{"a":"Rulers","b":"Insertion Point","c":"Work Area","d":"Zoom Slider"},"a":"c","e":"Work Area (منطقة العمل) هي المساحة الرئيسية التي تكتب وتحرر فيها المستند في وسط الشاشة. Rulers مساطر، وZoom Slider للتكبير."},{"sec":"S1 · تجميعات","page":14,"n":"54","q":"In MS Word, Insertion Point is also known as the _____________","o":{"a":"Pivot","b":"Table","c":"Cursor","d":"Box"},"a":"c","e":"Insertion Point (نقطة الإدراج) تُسمى أيضاً المؤشر (Cursor)، وهي الخط الوامض الذي تظهر عنده الكتابة."},{"sec":"S1 · تجميعات","page":15,"n":"55","q":"It shows details like the current page number, total word count, and the selected language:","o":{"a":"Search Box","b":"Status Bar","c":"View Buttons","d":"Tabs"},"a":"b","e":"Status Bar (شريط الحالة) يعرض رقم الصفحة الحالية وعدد الكلمات واللغة. Tabs لأوامر التبويب، وView Buttons لأنماط العرض."},{"sec":"S1 · تجميعات","page":15,"n":"56","q":"In MS Word 2021, the Status Bar allows you to adjust the zoom level of the document content as per your convenience.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن شريط الحالة يعرض المعلومات (الصفحة، الكلمات، اللغة)، أما ضبط التكبير فيتم بشريط التكبير Zoom Slider."},{"sec":"S1 · تجميعات","page":15,"n":"57","q":"It is providing quick access to frequently used commands like Save and Undo:","o":{"a":"Groups","b":"Tabs","c":"Ribbon","d":"Quick Access Toolbar"},"a":"d","e":"Quick Access Toolbar (شريط الوصول السريع) يعطيك أوامر شائعة مثل Save وUndo. Groups وTabs وRibbon أجزاء من الشريط الرئيسي."},{"sec":"S1 · تجميعات","page":15,"n":"58","q":"In MS Word, _____________ is a small arrow at the bottom right corner of certain groups in the Ribbon.","o":{"a":"Pointer","b":"Insertion Point","c":"Cursor","d":"Dialog Box Launcher"},"a":"d","e":"Dialog Box Launcher هو السهم الصغير في الزاوية السفلية اليمنى لبعض المجموعات، ويفتح نافذة خيارات كاملة للمجموعة."},{"sec":"S1 · تجميعات","page":15,"n":"59","q":"In Word 2021, the _____________ consists of several tabs.","o":{"a":"Search Box","b":"Ribbon","c":"Status Bar","d":"Rulers"},"a":"b","e":"الـRibbon (الشريط) يتكون من عدة تبويبات (Tabs). Search Box مربع بحث، وStatus Bar شريط الحالة، وRulers مساطر."},{"sec":"S1 · تجميعات","page":16,"n":"60","q":"In Word 2021, by using the _____________, you can quickly adjust the positioning of elements in your document.","o":{"a":"Zoom Slider","b":"Ribbon Display Options","c":"Focus Mode Button","d":"Rulers"},"a":"d","e":"Rulers (المساطر) تساعدك تضبط موضع العناصر في المستند بسرعة. Zoom Slider يغير التكبير فقط."},{"sec":"S1 · تجميعات","page":16,"n":"61","q":"The Zoom Slider in MS Word 2021 allows you to adjust the positioning of elements in document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Zoom Slider يضبط مستوى التكبير، أما ضبط موضع العناصر فبالمساطر Rulers."},{"sec":"S1 · تجميعات","page":16,"n":"62","q":"In Word 2021, you can switch between different views of your document using the View Buttons.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أزرار العرض (View Buttons) تنقلك بين طرق عرض المستند المختلفة."},{"sec":"S1 · تجميعات","page":16,"n":"63","q":"A ____________ in Word is a pre-designed document that provides a ready-made layout.","o":{"a":"document","b":"template","c":"ribbon","d":"text"},"a":"b","e":"Template (القالب) مستند جاهز التصميم يعطيك تخطيطاً جاهزاً. Document مستند عادي، وRibbon شريط الأوامر."},{"sec":"S1 · تجميعات","page":16,"n":"64","q":"If you save your document as file type \"Word template\", it will be saved with the _____________ extension.","o":{"a":".dotx","b":".doc","c":".docx","d":".dot"},"a":"a","e":"امتداد القالب في Word هو dotx. docx للمستند العادي، وdot الامتداد القديم للقالب."},{"sec":"S1 · تجميعات","page":17,"n":"65","q":"Press _____________ to select all the content in the document.","o":{"a":"Ctrl + Shift","b":"Ctrl + S","c":"Ctrl + A","d":"Ctrl + Tab"},"a":"c","e":"Ctrl + A يحدد كل محتوى المستند. Ctrl + S للحفظ، وCtrl + Shift وCtrl + Tab ليسا لتحديد الكل."},{"sec":"S1 · تجميعات","page":17,"n":"66","q":"The Backspace key removes the characters to the right of the cursor.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Backspace يحذف الحرف على يسار المؤشر. أما الحذف لليمين فبمفتاح Delete."},{"sec":"S1 · تجميعات","page":17,"n":"67","q":"The _____________ key removes the characters to the right of the cursor.","o":{"a":"Ctrl + A","b":"Backspace →","c":"Shift +","d":"Delete"},"a":"d","e":"مفتاح Delete يحذف الحروف على يمين المؤشر. Backspace يحذف على اليسار، وCtrl + A تحديد الكل."},{"sec":"S1 · تجميعات","page":17,"n":"68","q":"What does PDF stand for?","o":{"a":"Portable Drive Format","b":"Portable Design Format","c":"Prepare Document Format","d":"Portable Document Format"},"a":"d","e":"PDF اختصار Portable Document Format (صيغة المستند المحمول)."},{"sec":"S1 · تجميعات","page":17,"n":"69","q":"The ideal file format for sharing and printing documents is:","o":{"a":"PDF","b":"RTF","c":"TXT","d":"mp4"},"a":"a","e":"PDF هي الصيغة المثالية لمشاركة المستندات وطباعتها لأنها تحافظ على شكلها على كل الأجهزة. RTF وTXT أقل في الحفاظ على التنسيق، وmp4 للفيديو."},{"sec":"S1 · تدريبات","page":19,"n":"1","q":"It uses hardware devices and software to carry out the instructions to perform certain tasks, whether it's calculating numbers or sending emails.","o":{"a":"Automation","b":"Computing","c":"Scanner","d":"Operating System"},"a":"b","e":"Computing تعني الحوسبة: استخدام الأجهزة والبرامج لتنفيذ التعليمات، مثل حساب الأرقام أو إرسال الإيميل. Automation تعني التشغيل الآلي، وScanner جهاز إدخال، وOperating System برنامج مو وصف للعملية كلها. (ممكن يجي خيار Computer ويُعد صحيحاً.)"},{"sec":"S1 · تدريبات","page":19,"n":"2","q":"Facilitates efficient task completion without human intervention is one of characteristics of Computers called _____________","o":{"a":"Accuracy","b":"High Processing Speed","c":"Storage Capacity","d":"Automation"},"a":"d","e":"Automation (الأتمتة) هي إنجاز المهام بكفاءة بدون تدخل بشري. Accuracy الدقة، وHigh Processing Speed سرعة المعالجة، وStorage Capacity سعة التخزين، وكل واحدة خاصية مختلفة."},{"sec":"S1 · تدريبات","page":19,"n":"3","q":"Whatever the result is generated by the computer is NOT 100% right as per the instructions.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن خاصية الدقة (Accuracy) تعني أن النتيجة صحيحة 100% بحسب التعليمات المعطاة للحاسوب."},{"sec":"S1 · تدريبات","page":19,"n":"4","q":"What are the two main components of a computer system?","o":{"a":"Keyboard and mouse","b":"Monitor and printer","c":"Hardware and software","d":"CPU and motherboard"},"a":"c","e":"نظام الحاسوب يتكون من Hardware (المكونات المادية) وSoftware (البرامج). باقي الخيارات كلها مكونات مادية فقط، فما تغطي الجانبين."},{"sec":"S1 · تدريبات","page":19,"n":"5","q":"The physical components that display or present the output from the computer are called _____________ devices.","o":{"a":"output","b":"storage","c":"input","d":"memory"},"a":"a","e":"المكونات المادية التي تعرض النتائج تسمى أجهزة إخراج (output) مثل الشاشة والطابعة. input للإدخال، وstorage للتخزين، وmemory للذاكرة."},{"sec":"S1 · تدريبات","page":20,"n":"6","q":"Speaker is an input device.","o":{"a":"True","b":"False"},"a":"b","e":"السماعة تُخرج الصوت من الحاسوب، فهي جهاز إخراج (output) وليست إدخال. لذلك العبارة خطأ."},{"sec":"S1 · تدريبات","page":20,"n":"7","q":"The two most important processing devices in modern computing are the Central Processing Unit (CPU) and the _______________.","o":{"a":"Control Unit (CU)","b":"Random Access Memory (RAM)","c":"Word processor","d":"Graphics Processing Unit (GPU)"},"a":"d","e":"أهم جهازي معالجة هما CPU وGPU. الـRAM ذاكرة، والـWord processor برنامج، والـCU جزء داخل الـCPU وليس جهازاً مستقلاً."},{"sec":"S1 · تدريبات","page":21,"n":"8","q":"The _______________ acts as the master thinker, managing the operating system and running applications with precision and sequential logic.","o":{"a":"GPU","b":"CPU","c":"ROM","d":"ALU"},"a":"b","e":"الـCPU هو المفكر الرئيسي: يدير نظام التشغيل ويشغل التطبيقات بمنطق متسلسل. الـGPU للعمليات المتوازية، والـROM ذاكرة، والـALU يحسب فقط."},{"sec":"S1 · تدريبات","page":21,"n":"9","q":"The GPU acts as the master thinker, managing the operating system and running applications with precision and sequential logic.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن هذا وصف الـCPU. الـGPU مختص بمعالجة آلاف العمليات الصغيرة في الوقت نفسه."},{"sec":"S1 · تدريبات","page":21,"n":"10","q":"The GPU is a high-performance processor built to handle thousands of operations at the same time, making it ideal for tasks that requires to do thousands of small calculations at the same time.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الـGPU مصمم لمعالجة آلاف العمليات الصغيرة في نفس الوقت، ولهذا يناسب الرسوميات والحسابات المتوازية."},{"sec":"S1 · تدريبات","page":21,"n":"11","q":"What is the “brain” of the computer?","o":{"a":"ROM","b":"CPU","c":"RAM","d":"SSD"},"a":"b","e":"الـCPU هو «دماغ» الحاسوب. ROM وRAM ذاكرتان، وSSD وحدة تخزين."},{"sec":"S1 · تدريبات","page":21,"n":"12","q":"The _____________ coordinates the operations of all other components and manages the flow of data and instructions between them.","o":{"a":"ALU","b":"Motherboard","c":"ROM","d":"CU"},"a":"d","e":"الـCU (وحدة التحكم) تنسق عمل كل المكونات وتدير تدفق البيانات والتعليمات بينها. الـALU للحساب والمنطق، والـMotherboard لوحة تربط المكونات."},{"sec":"S1 · تدريبات","page":22,"n":"13","q":"The ALU coordinates the operations of all other components and manages the flow of data and instructions between them.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن هذا عمل وحدة التحكم CU. الـALU عملها العمليات الحسابية والمنطقية فقط."},{"sec":"S1 · تدريبات","page":22,"n":"14","q":"The _____________ is the central circuit board that connects all processing devices and enables communication between the various electronic components embedded on it.","o":{"a":"Motherboard","b":"CPU","c":"Primary Memory","d":"System Software"},"a":"a","e":"الـMotherboard (اللوحة الأم) هي اللوحة الإلكترونية الرئيسية التي تربط المعالجات وكل المكونات وتتيح التواصل بينها."},{"sec":"S1 · تدريبات","page":22,"n":"15","q":"Which of the following is an example of secondary memory?","o":{"a":"Flash drive","b":"RAM","c":"ROM","d":"CPU"},"a":"a","e":"الذاكرة الثانوية هي للتخزين الدائم، ومثالها Flash drive. الـRAM والـROM ذاكرة أولية، والـCPU معالج وليس ذاكرة."},{"sec":"S1 · تدريبات","page":22,"n":"16","q":"Memory devices are broadly classified into _____________ types.","o":{"a":"five","b":"six","c":"three","d":"two"},"a":"d","e":"الذاكرة نوعان فقط (two): أولية Primary وثانوية Secondary."},{"sec":"S1 · تدريبات","page":22,"n":"17","q":"It is also known as main memory:","o":{"a":"Secondary memory","b":"Hard Disk","c":"Primary memory","d":"Flash drive"},"a":"c","e":"الذاكرة الأولية Primary memory تسمى أيضاً الذاكرة الرئيسية (Main memory). أما Hard Disk وFlash drive وSecondary فهي ذاكرة ثانوية."},{"sec":"S1 · تدريبات","page":22,"n":"18","q":"_____________ is a crucial component of a computer system.","o":{"a":"Secondary memory","b":"Hard Disk","c":"Primary memory","d":"Flash drive"},"a":"c","e":"الذاكرة الأولية Primary memory مكون أساسي في الحاسوب لأن المعالج يتعامل معها مباشرة أثناء التشغيل. الباقي أنواع تخزين ثانوي."},{"sec":"S1 · تدريبات","page":23,"n":"19","q":"_____________ is the storage space where the computer temporarily holds data and instructions that are currently in use or being processed.","o":{"a":"Primary memory","b":"Compact disc","c":"Hard Disk","d":"Secondary memory"},"a":"a","e":"الذاكرة الأولية تحتفظ مؤقتاً بالبيانات والتعليمات التي تُستخدم الآن. القرص المدمج والقرص الصلب والذاكرة الثانوية للتخزين الدائم."},{"sec":"S1 · تدريبات","page":23,"n":"20","q":"Primary memory is directly accessible by the Central Processing Unit (CPU).","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الـCPU يصل للذاكرة الأولية مباشرة، ولهذا هي سريعة."},{"sec":"S1 · تدريبات","page":23,"n":"21","q":"\"RAM\" is a short-cut word for which of the following:","o":{"a":"Read Access Memory","b":"Redeem Access Memory","c":"Remark Access Memory","d":"Random Access Memory"},"a":"d","e":"RAM اختصار Random Access Memory (ذاكرة الوصول العشوائي). باقي الخيارات كلمات غير صحيحة."},{"sec":"S1 · تدريبات","page":23,"n":"22","q":"\"ROM\" is a short-cut word for which of the following:","o":{"a":"Read Only Memory","b":"Read Online Memory","c":"Random Output Memory","d":"Redeem Only Memory"},"a":"a","e":"ROM اختصار Read Only Memory (ذاكرة للقراءة فقط)."},{"sec":"S1 · تدريبات","page":23,"n":"23","q":"_____________is a volatile memory used by a computer to temporarily store data and instructions needed by CPU while performing tasks.","o":{"a":"ROM","b":"RAM","c":"hard disk cd. Flash drive"},"a":"b","e":"الـRAM ذاكرة متطايرة (Volatile) تخزن البيانات مؤقتاً أثناء عمل المعالج. الـROM غير متطايرة، والقرص الصلب وFlash تخزين ثانوي."},{"sec":"S1 · تدريبات","page":23,"n":"24","q":"When the computer is turned off, the data stored in RAM is erased.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الـRAM متطايرة، فتُمسح بياناتها عند إطفاء الجهاز."},{"sec":"S1 · تدريبات","page":24,"n":"25","q":"When the computer is turned off, the data stored in ROM is erased.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن الـROM غير متطايرة، فتبقى بياناتها حتى بعد إطفاء الجهاز."},{"sec":"S1 · تدريبات","page":24,"n":"26","q":"_____________ is non-volatile memory which holds the instruction even if the computer is powered off.","o":{"a":"ROM","b":"CPU","c":"ALU","d":"RAM"},"a":"a","e":"الـROM ذاكرة غير متطايرة تحتفظ بالتعليمات حتى لو انقطعت الكهرباء. الـRAM تُمسح، والـCPU والـALU ليسا ذاكرة."},{"sec":"S1 · تدريبات","page":24,"n":"27","q":"_____________ is used to store critical system instructions and data that are required to boot up the computer.","o":{"a":"SSD","b":"Hardware","c":"ROM","d":"RAM"},"a":"c","e":"الـROM تخزن تعليمات النظام الأساسية اللازمة لإقلاع الجهاز (boot). الـRAM مؤقتة، والـSSD تخزين، والـHardware كلمة عامة."},{"sec":"S1 · تدريبات","page":24,"n":"28","q":"It is a non-volatile memory and provides long-term storage for data, applications, and the operating system:","o":{"a":"Secondary memory","b":"Main memory","c":"Primary memory","d":"Motherboard"},"a":"a","e":"الذاكرة الثانوية غير متطايرة وتوفر تخزيناً طويل المدى للبيانات والتطبيقات ونظام التشغيل. الذاكرة الأولية (الرئيسية) مؤقتة."},{"sec":"S1 · تدريبات","page":24,"n":"29","q":"What is an example of secondary memory?","o":{"a":"ROM","b":"Compact disc","c":"Software","d":"RAM"},"a":"b","e":"القرص المدمج (Compact disc) مثال على الذاكرة الثانوية. الـROM والـRAM أولية، والـSoftware برامج وليس ذاكرة."},{"sec":"S1 · تدريبات","page":25,"n":"30","q":"_____________ refers to the collection of programs, data, and instructions written in any programming language that tells a computer how to perform specific tasks.","o":{"a":"Hardware","b":"Secondary memory","c":"Primary memory","d":"Software"},"a":"d","e":"Software هي مجموعة البرامج والتعليمات المكتوبة بلغة برمجة والتي تخبر الحاسوب كيف ينفذ المهام. Hardware هي الأجزاء المادية."},{"sec":"S1 · تدريبات","page":25,"n":"31","q":"_____________ is designed to control and manage a computer's hardware and provide an environment for running application programs.","o":{"a":"Input device","b":"System software","c":"Device driver","d":"Application software"},"a":"b","e":"System software تتحكم في عتاد الحاسوب وتوفر بيئة لتشغيل التطبيقات. Application software يستخدمه المستخدم مباشرة لمهام معينة، والـInput device جهاز وليس برنامجاً."},{"sec":"S1 · تدريبات","page":25,"n":"32","q":"_____________ acts as an interface between the user and the computer hardware.","o":{"a":"Operating system","b":"System software","c":"Device driver","d":"Application software"},"a":"a","e":"نظام التشغيل (Operating system) هو الوسيط بين المستخدم وعتاد الحاسوب. System software تسمية أوسع، وهو واحد من أنواعها."},{"sec":"S1 · تدريبات","page":25,"n":"33","q":"Device drivers are specialized programs that allow the operating system to communicate with the hardware devices.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Device drivers برامج تعريف تسمح لنظام التشغيل بالتواصل مع الأجهزة."},{"sec":"S1 · تدريبات","page":25,"n":"34","q":"_____________ is an example of the general purpose software.","o":{"a":"Device driver","b":"Operating system","c":"Web browsers","d":"System software"},"a":"c","e":"متصفحات الويب (Web browsers) مثال على البرامج العامة الغرض (General purpose). الباقي أنواع برامج نظام."},{"sec":"S1 · تدريبات","page":26,"n":"35","q":"Applications which are used to perform a special task such as Hotel Management Software, Employee Management Software and Learning Management software (Blackboard) is called as _____________","o":{"a":"Specific Purpose Software","b":"No Purpose Software","c":"Advanced Purpose Software","d":"General Purpose Software"},"a":"a","e":"البرامج التي تؤدي مهمة محددة مثل إدارة الفنادق أو الموظفين أو Blackboard تسمى Specific Purpose Software (خاصة الغرض)."},{"sec":"S1 · تدريبات","page":26,"n":"36","q":"_____________ is an example of the specific purpose software.","o":{"a":"Spreadsheet software","b":"Word processors","c":"Microsoft Edge","d":"Employee Management Software"},"a":"d","e":"برنامج إدارة الموظفين مخصص لمهمة محددة، فهو Specific purpose. أما Spreadsheet وWord processors وEdge فبرامج عامة الغرض."},{"sec":"S1 · تدريبات","page":26,"n":"37","q":"_____________ is an example of a software suite.","o":{"a":"Apple iWork","b":"Operating system","c":"Device driver","d":"System software"},"a":"a","e":"Apple iWork حزمة برامج (Software suite) تجمع عدة تطبيقات. نظام التشغيل وDevice driver وSystem software ليست حزم برامج."},{"sec":"S1 · تدريبات","page":26,"n":"38","q":"____________ is an example of word processors.","o":{"a":"Microsoft Excel","b":"Apple Pages","c":"Android","d":"Windows"},"a":"b","e":"Apple Pages معالج نصوص. Excel برنامج جداول بيانات، وAndroid وWindows أنظمة تشغيل."},{"sec":"S1 · تدريبات","page":26,"n":"39","q":"Microsoft Word 2021 has several advanced features, such as: Modern Commenting.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Modern Commenting (التعليقات الحديثة) من الميزات المتقدمة في Word 2021."},{"sec":"S1 · تدريبات","page":26,"n":"40","q":"The search box helps you quickly locate commands or features that you may be unfamiliar with.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: مربع البحث (Search box) يساعدك تلاقي الأوامر والميزات التي ما تعرف مكانها بسرعة."},{"sec":"S1 · تدريبات","page":27,"n":"41","q":"Word 2021 includes built-in translation tools allowing users to translate selected text or entire documents without requiring third-party plugins.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word 2021 فيه أدوات ترجمة مدمجة، ما تحتاج إضافات خارجية."},{"sec":"S1 · تدريبات","page":27,"n":"42","q":"In Word 2021, you cannot edit PDFs.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تعدل ملفات PDF في Word 2021."},{"sec":"S1 · تدريبات","page":27,"n":"43","q":"In Word 2021, you can directly edit PDFs, including text and images, and save them back as PDFs.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word 2021 يتيح تعديل النصوص والصور في PDF مباشرة ثم حفظها كـPDF."},{"sec":"S1 · تدريبات","page":27,"n":"44","q":"In Word 2021, the zoom slider button allows you to adjust the zoom level of the document content as per your convenience.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: شريط التكبير (Zoom slider) يضبط مستوى عرض المستند حسب راحتك."},{"sec":"S1 · تدريبات","page":27,"n":"45","q":"You can quickly find and use the right commands for various actions in your document by using _____________","o":{"a":"Status bar","b":"Ribbon Display Options","c":"Work area","d":"Tabs"},"a":"d","e":"التبويبات Tabs تحتوي الأوامر التي تنفذ بها الإجراءات المختلفة. Status bar شريط معلومات، وRibbon Display Options لإخفاء/إظهار الشريط، وWork area مكان الكتابة."},{"sec":"S1 · تدريبات","page":27,"n":"46","q":"_____________ helps you quickly find what you're looking for.","o":{"a":"Work area","b":"Insertion point","c":"Search box","d":"Tabs"},"a":"c","e":"مربع البحث Search box يساعدك تجد ما تبحث عنه بسرعة. Work area منطقة الكتابة، وInsertion point مؤشر الكتابة، وTabs تبويبات الأوامر."},{"sec":"S1 · تدريبات","page":28,"n":"47","q":"Using Ribbon Display Options, you can hide the ribbon completely, show only the tabs, or display both tabs and commands.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: خيارات عرض الشريط تتيح إخفاءه تماماً أو إظهار التبويبات فقط أو التبويبات والأوامر معاً."},{"sec":"S1 · تدريبات","page":28,"n":"48","q":"In Word, you can create a new document from an already open Word document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تنشئ مستنداً جديداً حتى وأنت داخل مستند Word مفتوح."},{"sec":"S1 · تدريبات","page":28,"n":"49","q":"You can create a new document in Word from:","o":{"a":"Status Bar","b":"View Buttons","c":"Templates","d":"Work Area"},"a":"c","e":"ننشئ مستنداً جديداً من القوالب Templates. باقي الخيارات أجزاء من واجهة Word للعرض والكتابة."},{"sec":"S1 · تدريبات","page":28,"n":"50","q":"To select a word using mouse in a document, _____________ on it.","o":{"a":"Left click","b":"Double click","c":"Single click","d":"Right click"},"a":"b","e":"لتحديد كلمة بالفأرة نضغط نقراً مزدوجاً (Double click) عليها."},{"sec":"S1 · تدريبات","page":28,"n":"51","q":"To select an entire paragraph using mouse in a document, _____________ on it.","o":{"a":"Single click","b":"Double click","c":"Triple click","d":"Left click"},"a":"c","e":"لتحديد فقرة كاملة بالفأرة نضغط ثلاث نقرات (Triple click) عليها. النقر المزدوج يحدد كلمة فقط."},{"sec":"S1 · تدريبات","page":28,"n":"52","q":"_____________ is used to save a document with a new name or in a different location.","o":{"a":"Save As","b":"Template","c":"Save","d":"Ribbon"},"a":"a","e":"Save As لحفظ المستند باسم جديد أو في مكان مختلف. Save يحفظ بنفس الاسم والمكان."},{"sec":"S1 · تدريبات","page":29,"n":"53","q":"______________ is used to overwrite the existing document with the changes and save it in the same location.","o":{"a":"Save As","b":"Template","c":"Save","d":"Ribbon"},"a":"c","e":"Save يستبدل الملف الموجود بالتعديلات في نفس المكان. أما Save As فينشئ نسخة جديدة باسم أو مكان مختلف."},{"sec":"S1 · تدريبات","page":29,"n":"54","q":"Microsoft Word allows users to save the document in different file formats.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: يتيح Word حفظ المستند بصيغ ملفات مختلفة مثل docx وPDF."},{"sec":"S2 · تجميعات","page":31,"n":"1","q":"_____________ refers to a numeric value that determines the height of characters (letters, numbers, punctuation marks).","o":{"a":"Watermark","b":"Font size","c":"Font style","d":"Font color"},"a":"b","e":"Font size هو رقم يحدد ارتفاع الحروف. Font style شكل الخط، وFont color لونه، وWatermark علامة مائلة خلف النص."},{"sec":"S2 · تجميعات","page":31,"n":"2","q":"_____________ is used to change the look of text in order to make it more distinctive or visually appealing.","o":{"a":"Watermark","b":"Font size","c":"Font style","d":"Font color"},"a":"c","e":"Font style يغيّر مظهر النص ليصير أوضح أو أجمل (عريض، مائل...). Font size يغيّر الحجم فقط."},{"sec":"S2 · تجميعات","page":31,"n":"3","q":"It is used to make the text thicker:","o":{"a":"Underline","b":"Italic","c":"Bold","d":"Strikethrough"},"a":"c","e":"Bold يجعل النص أسمك. Italic يميله، وUnderline يضع خطاً تحته، وStrikethrough يشطبه."},{"sec":"S2 · تجميعات","page":31,"n":"4","q":"_____________ used to slant the text to the right.","o":{"a":"Underline","b":"Bold","c":"Italic","d":"Strikethrough"},"a":"c","e":"Italic يميل النص لليمين. Bold يسمّكه، وUnderline يسطّره."},{"sec":"S2 · تجميعات","page":31,"n":"5","q":"Which of the following is the Keyboard Shortcut for Italic?","o":{"a":"Ctrl + B","b":"Ctrl + U","c":"Ctrl + A","d":"Ctrl + I"},"a":"d","e":"اختصار Italic هو Ctrl + I. Ctrl + B لـBold، وCtrl + U لـUnderline، وCtrl + A لتحديد الكل."},{"sec":"S2 · تجميعات","page":32,"n":"6","q":"By default, the text color of a Word document is set to Automatic which typically renders as black.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: لون النص الافتراضي Automatic ويظهر عادة أسود."},{"sec":"S2 · تجميعات","page":32,"n":"7","q":"By default, the text color of a Word document is set to Automatic which typically renders as _____________","o":{"a":"blue","b":"red","c":"black","d":"green _____________"},"a":"c","e":"لون النص الافتراضي Automatic ويظهر عادةً أسود (black)."},{"sec":"S2 · تجميعات","page":32,"n":"8","q":"The _____________ is used to add a colored background behind the text.","o":{"a":"text highlight color","b":"double strikethrough","c":"subscript","d":"change case"},"a":"a","e":"Text highlight color يضيف لون خلفية خلف النص مثل قلم التظليل. Double strikethrough وSubscript وChange case لا تضيف خلفية."},{"sec":"S2 · تجميعات","page":32,"n":"9","q":"_____________ is a text formatting tool that draws a horizontal line through the middle of the text.","o":{"a":"Double strikethrough","b":"Superscript","c":"Font size","d":"Strikethrough"},"a":"d","e":"Strikethrough يرسم خطاً أفقياً واحداً في منتصف النص. Double strikethrough يرسم خطين، وSuperscript يرفع النص."},{"sec":"S2 · تجميعات","page":32,"n":"10","q":"Double strikethrough draws a double line through the middle of the selected text.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Double strikethrough يرسم خطين في منتصف النص المحدد."},{"sec":"S2 · تجميعات","page":32,"n":"11","q":"Strikethrough draws a double line through the middle of the selected text.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Strikethrough يرسم خطاً واحداً فقط. الخطان هما Double strikethrough."},{"sec":"S2 · تجميعات","page":33,"n":"12","q":"In MS Word, subscript appears slightly _____________ the baseline and is commonly used in mathematical formulas or chemical equations.","o":{"a":"below","b":"right","c":"left","d":"above"},"a":"a","e":"Subscript يظهر أسفل خط الأساس (below) قليلاً، ويُستخدم في المعادلات الكيميائية مثل H₂O."},{"sec":"S2 · تجميعات","page":33,"n":"13","q":"In Microsoft Word 2021, the _____________ feature allows you to easily modify the capitalization of text without retyping it.","o":{"a":"Watermark","b":"Font color","c":"Subscript","d":"Change Case"},"a":"d","e":"Change Case يغيّر حالة الأحرف (كبيرة/صغيرة) بدون إعادة كتابة النص."},{"sec":"S2 · تجميعات","page":33,"n":"14","q":"In Microsoft Word, _____________ are lines or edges that can be applied to text or paragraphs to improve the document's visual presentation.","o":{"a":"borders","b":"format printer","c":"text effect","d":"line spacing"},"a":"a","e":"Borders هي الخطوط أو الحواف التي تُضاف حول النص أو الفقرات لتحسين الشكل. Line spacing للمسافة بين الأسطر، وFormat painter لنسخ التنسيق."},{"sec":"S2 · تجميعات","page":33,"n":"15","q":"The _____________ group allows users to cut, copy, and paste content within a document or across multiple documents.","o":{"a":"Paragraph","b":"Font","c":"Clipboard","d":"Tables"},"a":"c","e":"مجموعة Clipboard فيها أوامر القص والنسخ واللصق. Font للخطوط، وParagraph للفقرات، وTables للجداول."},{"sec":"S2 · تجميعات","page":34,"n":"16","q":"In Word, the clipboard temporarily stores information that a user wants to copy or move from one section of a document to another.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الحافظة تخزن مؤقتاً ما تنسخه أو تنقله من مكان لآخر في المستند."},{"sec":"S2 · تجميعات","page":34,"n":"17","q":"MS Word offers the following clipboard commands only: Cut, Copy, Paste.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن مجموعة Clipboard تتضمن أيضاً Format Painter، وليست فقط Cut وCopy وPaste."},{"sec":"S2 · تجميعات","page":34,"n":"18","q":"It removes the selected text and stores it in the clipboard:","o":{"a":"The Copy command","b":"The Paste command","c":"The Cut command","d":"The Format Painter"},"a":"c","e":"أمر Cut (قص) يحذف النص المحدد ويخزنه في الحافظة. Copy ينسخه بدون حذف، وPaste يلصقه."},{"sec":"S2 · تجميعات","page":34,"n":"19","q":"_____________ determines the position of text on the page, aligning it to the left, center, right, or justifying it.","o":{"a":"Format Painter","b":"Undo and Redo","c":"Text Alignment","d":"Paragraph Spacing"},"a":"c","e":"Text Alignment يحدد موضع النص في الصفحة: يسار أو وسط أو يمين أو ضبط. Paragraph Spacing للمسافات بين الفقرات."},{"sec":"S2 · تجميعات","page":34,"n":"20","q":"The text is aligned to the left margin, with uneven spacing on the right, using the keyboard shortcut:","o":{"a":"Ctrl + J","b":"Ctrl + D","c":"Ctrl + R","d":"Ctrl + L"},"a":"d","e":"Ctrl + L لمحاذاة النص لليسار. Ctrl + R لليمين، وCtrl + J للضبط (Justify)، وCtrl + D لنافذة الخط."},{"sec":"S2 · تجميعات","page":35,"n":"21","q":"The text is aligned to the right margin, with the left margin remaining uneven, using the keyboard shortcut:","o":{"a":"Ctrl + R","b":"Ctrl + E","c":"Ctrl + L","d":"Ctrl + V"},"a":"a","e":"Ctrl + R لمحاذاة النص لليمين. Ctrl + E للتوسيط، وCtrl + L لليسار."},{"sec":"S2 · تجميعات","page":35,"n":"22","q":"_____________ refers to the vertical space between lines of text within a paragraph.","o":{"a":"Paragraph Spacing","b":"Indentation","c":"Line Spacing","d":"Center Alignment"},"a":"c","e":"Line Spacing هو المسافة الرأسية بين الأسطر داخل الفقرة نفسها. Paragraph Spacing بين الفقرات، وIndentation مسافة بداية الفقرة."},{"sec":"S2 · تجميعات","page":35,"n":"23","q":"It refers to the amount of vertical space added before and after a paragraph:","o":{"a":"Paragraph Spacing","b":"Indentation","c":"Line Spacing","d":"Right Alignment"},"a":"a","e":"Paragraph Spacing هو المسافة الرأسية قبل الفقرة وبعدها. Line Spacing بين الأسطر داخل الفقرة."},{"sec":"S2 · تجميعات","page":35,"n":"24","q":"Paragraph spacing refers to the vertical space between lines of text within a paragraph.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن هذا تعريف Line Spacing. Paragraph Spacing هو المسافة قبل الفقرة وبعدها."},{"sec":"S2 · تجميعات","page":36,"n":"25","q":"In Word, _____________ refers to the space added at the beginning of a paragraph.","o":{"a":"Watermark","b":"Indentation","c":"Multilevel List","d":"List"},"a":"b","e":"Indentation (المسافة البادئة) هي المسافة المضافة في بداية الفقرة. Watermark علامة مائية، وList قائمة."},{"sec":"S2 · تجميعات","page":36,"n":"26","q":"In Word, you cannot adjust the indentation by increasing or decreasing the space at the beginning of a paragraph.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Word يتيح زيادة أو تقليل المسافة البادئة في بداية الفقرة."},{"sec":"S2 · تجميعات","page":36,"n":"27","q":"A _____________ is a faded image or text that appears in the background of a document.","o":{"a":"Strikethrough","b":"Indentation","c":"Font size","d":"Watermark"},"a":"d","e":"Watermark صورة أو نص باهت يظهر في خلفية المستند. Strikethrough شطب، وIndentation مسافة، وFont size حجم."},{"sec":"S2 · تجميعات","page":36,"n":"28","q":"Which of the following is used to indicate the document's status, such as \"Confidential\", \"Approved\" etc.?","o":{"a":"Watermark","b":"Find and Replace","c":"Line spacing","d":"Template"},"a":"a","e":"Watermark يُستخدم لبيان حالة المستند مثل Confidential أو Approved. Find and Replace للبحث والاستبدال، وLine spacing للأسطر."},{"sec":"S2 · تجميعات","page":36,"n":"29","q":"In Word 2021, you cannot remove a watermark.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تحذف العلامة المائية (Watermark) في Word 2021."},{"sec":"S2 · تجميعات","page":37,"n":"30","q":"Which of the following is not a valid type of lists in Microsoft Word?","o":{"a":"Multilevel list","b":"Numbered list","c":"Bulleted list","d":"Heading list"},"a":"d","e":"أنواع القوائم في Word: Bulleted (نقطية) وNumbered (مرقمة) وMultilevel (متعددة المستويات). Heading list ليست نوعاً منها."},{"sec":"S2 · تدريبات","page":39,"n":"1","q":"In Word, the _____________ group allows you to change the appearance of text such as size, color etc.","o":{"a":"Paragraph","b":"Font","c":"Clipboard","d":"Illustrations"},"a":"b","e":"مجموعة Font تغيّر مظهر النص مثل الحجم واللون. Paragraph للفقرات، وClipboard للنسخ واللصق، وIllustrations للصور والأشكال."},{"sec":"S2 · تدريبات","page":39,"n":"2","q":"MS Word offers three font styles.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أنماط الخط ثلاثة هي Bold وItalic وUnderline."},{"sec":"S2 · تدريبات","page":39,"n":"3","q":"MS Word offers three font styles: Underline, Bold, Italic.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أنماط الخط الثلاثة هي Underline وBold وItalic."},{"sec":"S2 · تدريبات","page":39,"n":"4","q":"The underline font style is used to add a line below the text and its shortcut is Ctrl + U.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Underline يضيف خطاً تحت النص، واختصاره Ctrl + U."},{"sec":"S2 · تدريبات","page":39,"n":"5","q":"The bold font style is used to make the text thicker and its shortcut is Ctrl + I.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن اختصار Bold هو Ctrl + B. أما Ctrl + I فللمائل Italic."},{"sec":"S2 · تدريبات","page":39,"n":"6","q":"In MS Word, _____________ draws a single line.","o":{"a":"Double strikethrough","b":"Subscript","c":"Change Case","d":"Strikethrough"},"a":"d","e":"Strikethrough يرسم خطاً واحداً. Double strikethrough يرسم خطين، وSubscript وChange Case لا ترسم خطوطاً."},{"sec":"S2 · تدريبات","page":40,"n":"7","q":"You can use the keyboard shortcut _____________ to open the Font dialog box.","o":{"a":"Ctrl + I","b":"Ctrl + A","c":"Ctrl + D","d":"Ctrl + F"},"a":"c","e":"Ctrl + D يفتح نافذة Font. Ctrl + I للمائل، وCtrl + A لتحديد الكل، وCtrl + F للبحث."},{"sec":"S2 · تدريبات","page":40,"n":"8","q":"In Microsoft Word, _____________ are formatting features that enable you to adjust the placement of text relative to the standard text line.","o":{"a":"subscript and superscript","b":"undo and redo","c":"line spacing and paragraph","d":"strikethrough and double spacing strikethrough"},"a":"a","e":"Subscript وSuperscript يضبطان موضع النص بالنسبة لسطر الكتابة العادي (أسفل أو أعلى). Undo/Redo للتراجع والإعادة."},{"sec":"S2 · تدريبات","page":40,"n":"9","q":"In Word, _____________ appears slightly below the baseline and is commonly used in mathematical formulas or chemical equations.","o":{"a":"Superscript","b":"Font size","c":"Subscript","d":"Lowercase"},"a":"c","e":"Subscript يظهر أسفل خط الأساس قليلاً ويُستخدم في المعادلات الكيميائية. Superscript يظهر أعلى خط الأساس."},{"sec":"S2 · تدريبات","page":40,"n":"10","q":"In Word, _____________ appears just above the baseline and often used for mathematical exponents.","o":{"a":"Superscript","b":"Font size","c":"Subscript","d":"Lowercase"},"a":"a","e":"Superscript يظهر أعلى خط الأساس مباشرة، ويُستخدم للأسس الرياضية. Subscript يظهر أسفله."},{"sec":"S2 · تدريبات","page":40,"n":"11","q":"In Word, you can switch between lowercase, uppercase, or other case styles.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تبدّل بين الأحرف الصغيرة والكبيرة وأنماط أخرى بأمر Change Case."},{"sec":"S2 · تدريبات","page":41,"n":"12","q":"It capitalizes the first letter of each sentence:","o":{"a":"Lowercase","b":"Capitalize each word","c":"Uppercase","d":"Sentence case"},"a":"d","e":"Sentence case يجعل أول حرف من كل جملة كبيراً. Capitalize each word يكبّر أول حرف من كل كلمة، وUppercase يكبّر كل الحروف."},{"sec":"S2 · تدريبات","page":41,"n":"13","q":"In Microsoft Word, the _____________ feature in Microsoft Word allows users to remove all applied text formatting from the selected content.","o":{"a":"Clear All Formatting","b":"Subscript","c":"Shading","d":"Custom watermark"},"a":"a","e":"Clear All Formatting يزيل كل التنسيق المطبق على النص المحدد. Shading يلوّن الخلفية، وSubscript وCustom watermark لا تمسح التنسيق."},{"sec":"S2 · تدريبات","page":41,"n":"14","q":"You can use the keyboard shortcut _____________ to clear all formatting.","o":{"a":"Ctrl + D","b":"Ctrl + A","c":"Ctrl + Spacebar","d":"Ctrl + H"},"a":"c","e":"Ctrl + Spacebar يمسح التنسيق من النص المحدد. Ctrl + D يفتح نافذة الخط، وCtrl + A تحديد الكل."},{"sec":"S2 · تدريبات","page":41,"n":"15","q":"In Microsoft Word 2021, _____________ is the process of applying a background color to text or paragraphs, helping to highlight or distinguish specific sections of content within a document.","o":{"a":"Shading","b":"Uppercase","c":"List","d":"Border"},"a":"a","e":"Shading هو تطبيق لون خلفية على النص أو الفقرات لتمييزها. Border حدود، وList قائمة، وUppercase أحرف كبيرة."},{"sec":"S2 · تدريبات","page":41,"n":"16","q":"Format Painter does not copy the formatting from one section of text and apply it to another.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Format Painter ينسخ التنسيق من نص ويطبقه على نص آخر."},{"sec":"S2 · تدريبات","page":42,"n":"17","q":"In Word, the keyboard shortcut to copy a text is: Ctrl + C.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: اختصار النسخ هو Ctrl + C."},{"sec":"S2 · تدريبات","page":42,"n":"18","q":"In Word, the keyboard shortcut to cut a text is:","o":{"a":"Ctrl + V","b":"Ctrl + X","c":"Ctrl + A","d":"Ctrl + D"},"a":"b","e":"اختصار القص هو Ctrl + X. Ctrl + V للصق، وCtrl + A لتحديد الكل، وCtrl + D لنافذة الخط."},{"sec":"S2 · تدريبات","page":42,"n":"19","q":"In Microsoft Word, the _____________ command in Microsoft Word is a tool that allows you to copy the formatting from one section of the document and apply it to another section.","o":{"a":"Copy","b":"Cut","c":"Format Painter","d":"Undo"},"a":"c","e":"Format Painter ينسخ التنسيق من جزء ويطبقه على جزء آخر. Copy ينسخ المحتوى، وCut يقصه، وUndo يتراجع."},{"sec":"S2 · تدريبات","page":42,"n":"20","q":"Text Effects are special formatting options that can be applied to text to make it more eye-catching and enhance the overall look of your document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Text Effects خيارات تنسيق خاصة تجعل النص أجمل وأكثر جذباً."},{"sec":"S2 · تدريبات","page":42,"n":"21","q":"In MS Word, _____________ commands are essential for quickly correcting mistakes or redoing an action you've undone.","o":{"a":"Copy and Paste","b":"Undo and Redo","c":"Subscript and Superscript","d":"Cut and Format Painter"},"a":"b","e":"Undo وRedo للتراجع عن الخطأ أو إعادة ما تراجعت عنه. Copy/Paste ونحوها لا تقوم بذلك."},{"sec":"S2 · تدريبات","page":43,"n":"22","q":"It reverses the most recent action in your document:","o":{"a":"Justify Alignment","b":"Redo","c":"Undo","d":"Replace"},"a":"c","e":"Undo يتراجع عن آخر إجراء في المستند. Redo يعيد إجراءً تراجعت عنه، وReplace للاستبدال."},{"sec":"S2 · تدريبات","page":43,"n":"23","q":"In Word, Redo allows you to reapply an action that was undone.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Redo يعيد تطبيق إجراء تم التراجع عنه."},{"sec":"S2 · تدريبات","page":43,"n":"24","q":"In Word, you may use the keyboard shortcut _____________ to undo the last action.","o":{"a":"Ctrl + H","b":"Ctrl + Z","c":"Ctrl + F","d":"Ctrl + A"},"a":"b","e":"Ctrl + Z هو اختصار Undo (تراجع). Ctrl + H للاستبدال، وCtrl + F للبحث، وCtrl + A تحديد الكل."},{"sec":"S2 · تدريبات","page":43,"n":"25","q":"In MS Word, you may use the keyboard shortcut Ctrl + Y to repeat the last undone action.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Ctrl + Y يعيد الإجراء الذي تم التراجع عنه (Redo)."},{"sec":"S2 · تدريبات","page":43,"n":"26","q":"The keyboard shortcut for center alignment is Ctrl + J.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن اختصار التوسيط هو Ctrl + E. أما Ctrl + J فللضبط (Justify)."},{"sec":"S2 · تدريبات","page":43,"n":"27","q":"_____________ adds space between words so that both the left and right edges of each line align with the margins.","o":{"a":"Center alignment","b":"Justify alignment","c":"Right alignment","d":"Left alignment"},"a":"b","e":"Justify alignment يوزع المسافات بين الكلمات حتى يتساوى طرفا السطر مع الهوامش."},{"sec":"S2 · تدريبات","page":44,"n":"28","q":"Indentation is used to indicate the beginning of a new paragraph or section.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Indentation (المسافة البادئة) تدل على بداية فقرة أو قسم جديد."},{"sec":"S2 · تدريبات","page":44,"n":"29","q":"In Microsoft Word, you can efficiently navigate and modify your document using the Find and Replace commands.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أوامر Find وReplace تساعدك على التنقل والتعديل بكفاءة في المستند."},{"sec":"S2 · تدريبات","page":44,"n":"30","q":"Word allows you to automatically search for specific words or phrases throughout your document with the _____________ command.","o":{"a":"Find","b":"Search","c":"Replace","d":"Font size _____________"},"a":"a","e":"أمر Find يبحث تلقائياً عن كلمات أو عبارات في المستند. Replace للاستبدال، وFont size لا علاقة له بالبحث."},{"sec":"S2 · تدريبات","page":44,"n":"31","q":"In Word, the _____________ command enables you to quickly make changes by replacing words or phrases with new ones","o":{"a":"Find","b":"Watermark","c":"Replace","d":"Change Case"},"a":"c","e":"أمر Replace يستبدل الكلمات أو العبارات بأخرى جديدة بسرعة. Find يبحث فقط، وWatermark وChange Case لا تقوم بذلك."},{"sec":"S2 · تدريبات","page":44,"n":"32","q":"In Word, use the keyboard shortcut _____________ to open the Search navigation pane.","o":{"a":"Ctrl + H","b":"Ctrl + V","c":"Ctrl + F","d":"Ctrl + Z"},"a":"c","e":"Ctrl + F يفتح لوحة البحث (Search navigation pane). Ctrl + H يفتح Find and Replace، وCtrl + V للصق."},{"sec":"S2 · تدريبات","page":45,"n":"33","q":"In Word, use the keyboard shortcut _____________ to open the Find and Replace dialog box.","o":{"a":"Ctrl + H","b":"Ctrl + Y","c":"Ctrl + C","d":"Ctrl + D"},"a":"a","e":"Ctrl + H يفتح نافذة Find and Replace. Ctrl + Y للإعادة، وCtrl + C للنسخ، وCtrl + D لنافذة الخط."},{"sec":"S2 · تدريبات","page":45,"n":"34","q":"A _____________ is a personalized image or text placed in the background of a document.","o":{"a":"Custom watermark","b":"Find","c":"Watermark","d":"List"},"a":"a","e":"Custom watermark هي علامة مائية مخصصة (صورة أو نص) تضعها بنفسك في الخلفية. Watermark العادية تكون جاهزة."},{"sec":"S2 · تدريبات","page":45,"n":"35","q":"A _____________ is a collection of items that are presented in either an ordered or unordered sequence.","o":{"a":"border","b":"watermark","c":"list","d":"paragraph spacing"},"a":"c","e":"القائمة (List) مجموعة عناصر مرتبة أو غير مرتبة. Border حدود، وWatermark علامة مائية، وParagraph spacing مسافات."},{"sec":"S2 · تدريبات","page":45,"n":"36","q":"In Microsoft Word, there are three common types of lists: bulleted lists, numbered lists and Multilevel list.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الأنواع الشائعة ثلاثة: نقطية ومرقمة ومتعددة المستويات."},{"sec":"S2 · تدريبات","page":45,"n":"37","q":"In Microsoft Word, a Multilevel List allows you to organize items in a hierarchical structure.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: القائمة متعددة المستويات (Multilevel) ترتب العناصر بشكل هرمي."},{"sec":"S3 · تجميعات","page":47,"n":"1","q":"A _____________ is a structure used to present information in rows and columns.","o":{"a":"picture","b":"shape","c":"table","d":"text box"},"a":"c","e":"الجدول (Table) بنية لعرض المعلومات في صفوف وأعمدة. الصورة والشكل وصندوق النص لها وظائف أخرى."},{"sec":"S3 · تجميعات","page":47,"n":"2","q":"When you insert a table, two additional tabs appear at the top of the ribbon. These are called _____________ tabs.","o":{"a":"groups","b":"contextual","c":"tools","d":"columns ._____________"},"a":"b","e":"التبويبان الإضافيان يسميان Contextual tabs (تبويبات سياقية) لأنها تظهر فقط عند التعامل مع الجدول."},{"sec":"S3 · تجميعات","page":47,"n":"3","q":"When you insert a table, two additional tabs appear at the top of the ribbon. These are called contextual tabs, which are: _____________.","o":{"a":"Table Data & View","b":"Table Merge & Review","c":"Table Review & Center","d":"Table Design & Layout"},"a":"d","e":"التبويبان هما Table Design وLayout. باقي الخيارات أسماء غير صحيحة."},{"sec":"S3 · تجميعات","page":47,"n":"4","q":"____________ allows you to combine two or more adjacent cells into a single, larger cell.","o":{"a":"Merging cells","b":"Splitting Cells","c":"Splitting a table","d":"Convert to text"},"a":"a","e":"Merging cells يدمج خليتين أو أكثر متجاورتين في خلية أكبر. Splitting يقسم، وConvert to text يحول الجدول إلى نص."},{"sec":"S3 · تجميعات","page":47,"n":"5","q":"In MS Word 2021, _____________ is useful for dividing and arranging information more efficiently within the table.","o":{"a":"Merging cells","b":"Splitting cells","c":"Splitting a Table","d":"Cropping image"},"a":"b","e":"Splitting cells (تقسيم الخلايا) يساعد على تنظيم المعلومات داخل الجدول بشكل أفضل. Merging يدمج، وCropping لقص الصور."},{"sec":"S3 · تجميعات","page":48,"n":"6","q":"In Microsoft Word, you can split a table cell into several smaller cells.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تقسم خلية جدول إلى عدة خلايا أصغر."},{"sec":"S3 · تجميعات","page":48,"n":"7","q":"In MS Word, splitting a table involves dividing the existing table into two or more distinct tables.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقسيم الجدول (Splitting a table) معناه فصله إلى جدولين أو أكثر."},{"sec":"S3 · تجميعات","page":48,"n":"8","q":"In MS Word, splitting cells involves dividing the existing table into two or more distinct tables.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Splitting cells يقسم الخلية إلى خلايا أصغر. أما تقسيم الجدول إلى جدولين فهو Splitting a table."},{"sec":"S3 · تجميعات","page":48,"n":"9","q":"In MS Word, splitting a table cell involves dividing the existing table into two or more distinct tables.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن تقسيم الخلية يقسمها إلى خلايا أصغر. فصل الجدول إلى جدولين هو Splitting a table."},{"sec":"S3 · تجميعات","page":48,"n":"10","q":"In Microsoft Word, the ____________ Command allows to transform a table structure into a plain text format while retaining the data from the table cells.","o":{"a":"Table","b":"Table Style","c":"Convert to text","d":"Visual communication"},"a":"c","e":"أمر Convert to Text يحول الجدول إلى نص عادي مع بقاء بيانات الخلايا. Table Style لتنسيق الجدول فقط."},{"sec":"S3 · تجميعات","page":48,"n":"11","q":"_____________ is the process of using graphical elements to convey information and ideas.","o":{"a":"Visual communication","b":"Theme","c":"Page Color","d":"Footer"},"a":"a","e":"Visual communication هو استخدام العناصر الرسومية لنقل المعلومات والأفكار. Theme وPage Color وFooter لها وظائف أخرى."},{"sec":"S3 · تجميعات","page":49,"n":"12","q":"In MS Word, a _____________ is any image or graphic that can be inserted into a document.","o":{"a":"Page Color","b":"header","c":"shapes","d":"picture"},"a":"d","e":"Picture (الصورة) هي أي صورة أو رسم يمكن إدراجه في المستند. Page Color لون الخلفية، وheader رأس الصفحة، وShapes أشكال."},{"sec":"S3 · تجميعات","page":49,"n":"13","q":"In Word, ______________ allows you to remove unwanted parts from the image.","o":{"a":"Shape","b":"Cropping","c":"Splitting a cell","d":"Theme"},"a":"b","e":"Cropping (القص) يزيل الأجزاء غير المرغوبة من الصورة. Splitting a cell للجداول، وTheme للتصميم العام."},{"sec":"S3 · تجميعات","page":49,"n":"14","q":"_____________ are graphical elements that add visual appeal and clarity to your document.","o":{"a":"Shapes","b":"Pictures","c":"Charts","d":"Tables"},"a":"a","e":"الأشكال Shapes عناصر رسومية تضيف جمالاً ووضوحاً للمستند. Pictures صور، وCharts مخططات بيانات، وTables جداول."},{"sec":"S3 · تجميعات","page":49,"n":"15","q":"Which of the following is not an example of Shapes?","o":{"a":"Rectangles","b":"Arrows","c":"Circles","d":"Charts"},"a":"d","e":"Charts (المخططات) ليست من الأشكال Shapes. المستطيلات والأسهم والدوائر كلها أشكال."},{"sec":"S3 · تجميعات","page":49,"n":"16","q":"A Text Box allows you to add text anywhere in your document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Text Box يسمح لك بإضافة نص في أي مكان من المستند."},{"sec":"S3 · تجميعات","page":50,"n":"17","q":"In MS Word, _____________ is a tool that allows you to create simple and attractive diagrams to display information, ideas or processes in an easily understandable way.","o":{"a":"header","b":"chart","c":"picture","d":"SmartArt"},"a":"d","e":"SmartArt أداة لإنشاء رسوم توضيحية بسيطة وجذابة تعرض المعلومات أو الأفكار أو العمليات بسهولة. Chart لتمثيل البيانات."},{"sec":"S3 · تجميعات","page":50,"n":"18","q":"A _____________ is a visual representation of data that makes information easier to understand and analyze.","o":{"a":"theme","b":"chart","c":"footer","d":"margin"},"a":"b","e":"Chart (المخطط) تمثيل مرئي للبيانات يسهل فهمها وتحليلها. Theme وFooter وMargin لا تمثل بيانات."},{"sec":"S3 · تجميعات","page":50,"n":"19","q":"A ____________is a predefined set of formatting options, including colors, fonts, and effects, that give your document a consistent and professional look.","o":{"a":"theme","b":"chart","c":"page color","d":"header"},"a":"a","e":"Theme مجموعة جاهزة من الألوان والخطوط والتأثيرات تعطي المستند مظهراً متناسقاً واحترافياً."},{"sec":"S3 · تجميعات","page":50,"n":"20","q":"_____________ are particularly useful for creating documents that require a uniform design, such as reports or business documents.","o":{"a":"Shapes","b":"SmartArt","c":"Themes","d":"Margins"},"a":"c","e":"Themes مفيدة للمستندات التي تحتاج تصميماً موحداً مثل التقارير والمستندات التجارية. Shapes وSmartArt وMargins لا تحقق ذلك."},{"sec":"S3 · تجميعات","page":51,"n":"21","q":"In MS Word, a _____________ consists of Theme Colors, Theme Fonts, and Theme Effects that define the overall design of your document.","o":{"a":"landscape","b":"column","c":"page color","d":"theme"},"a":"d","e":"Theme يتكون من ألوان وخطوط وتأثيرات تحدد التصميم العام للمستند. Landscape اتجاه، وPage color لون خلفية فقط."},{"sec":"S3 · تجميعات","page":51,"n":"22","q":"Page color allows you to change the background color of your document's pages.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Page color يغير لون خلفية صفحات المستند."},{"sec":"S3 · تجميعات","page":51,"n":"23","q":"In Word, _____________ allow you to add special effects to the background of your document's content.","o":{"a":"Themes","b":"Columns","c":"Merging cells","d":"Fill Effects"},"a":"d","e":"Fill Effects تضيف تأثيرات خاصة لخلفية المستند مثل التدرجات والأنسجة. Themes وColumns وMerging cells لا تفعل ذلك."},{"sec":"S3 · تجميعات","page":51,"n":"24","q":"In Microsoft Word, headers and footers are sections of the document that appear at the top and bottom of each page, respectively.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الرأس (Header) أعلى كل صفحة، والتذييل (Footer) أسفلها."},{"sec":"S3 · تجميعات","page":52,"n":"25","q":"This area is located at the top of each page is called _____________.","o":{"a":"Header","b":"Footer","c":"Portrait","d":"Landscape"},"a":"a","e":"الـHeader هو المنطقة في أعلى كل صفحة. Footer أسفلها، وPortrait وLandscape اتجاهان للصفحة."},{"sec":"S3 · تجميعات","page":52,"n":"26","q":"This area is located at the bottom of each page is called _____________.","o":{"a":"Header","b":"Footer","c":"Portrait","d":"Landscape"},"a":"b","e":"الـFooter (التذييل) هو المنطقة في أسفل كل صفحة. Header في أعلاها."},{"sec":"S3 · تجميعات","page":52,"n":"27","q":"In Microsoft Word, _____________ refers to the direction in which the content is displayed on a page.","o":{"a":"Page Color","b":"Theme Font","c":"Page Orientation","d":"Margin"},"a":"c","e":"Page Orientation (اتجاه الصفحة) يحدد اتجاه عرض المحتوى: عمودي أو أفقي. Margin للهوامش، وPage Color لون الخلفية."},{"sec":"S3 · تجميعات","page":52,"n":"28","q":"The default page orientation in MS Word is Pivot.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن الاتجاه الافتراضي في Word هو Portrait (عمودي). كلمة Pivot غير صحيحة هنا."},{"sec":"S3 · تجميعات","page":52,"n":"29","q":"Page Orientation refers to the number of columns in which the content is displayed on a page.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن Page Orientation هو اتجاه الصفحة (عمودي/أفقي)، وليس عدد الأعمدة. عدد الأعمدة يضبطه أمر Columns."},{"sec":"S3 · تجميعات","page":52,"n":"30","q":"Page Orientation in Microsoft Word refers to the direction in which the content is displayed on a worksheet.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن اتجاه الصفحة يخص الصفحة (page) في Word. كلمة worksheet تخص Excel."},{"sec":"S3 · تجميعات","page":53,"n":"31","q":"In Microsoft Word, the _____________ command allows you to arrange text into multiple columns, similar to how text is displayed in newspapers, newsletters, or brochures.","o":{"a":"Merge","b":"Split a Table","c":"Cropping","d":"Columns"},"a":"d","e":"أمر Columns يرتب النص في أعمدة متعددة مثل الجرائد والنشرات. Merge وSplit a Table وCropping أوامر مختلفة."},{"sec":"S3 · تدريبات","page":55,"n":"1","q":"_____________ are made up of horizontal rows and vertical columns that create cells.","o":{"a":"Headers","b":"Tables","c":"Shapes","d":"Charts"},"a":"b","e":"الجداول (Tables) تتكون من صفوف أفقية وأعمدة رأسية تكوّن خلايا. Shapes أشكال، وCharts مخططات، وHeaders رؤوس صفحات."},{"sec":"S3 · تدريبات","page":55,"n":"2","q":"In MS Word, you cannot add extra rows or columns to accommodate more data.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تضيف صفوفاً وأعمدة إضافية للجدول."},{"sec":"S3 · تدريبات","page":55,"n":"3","q":"_____________ is done when you need to separate different sections of a table that should be handled or formatted separately.","o":{"a":"Splitting a Table","b":"Splitting Cells","c":"Cropping Image","d":"Page Color"},"a":"a","e":"Splitting a Table يُستخدم لفصل أجزاء الجدول التي تحتاج معالجة أو تنسيقاً مستقلاً. Splitting Cells يقسم خلية فقط."},{"sec":"S3 · تدريبات","page":55,"n":"4","q":"In MS Word 2021, _____________ allow you to quickly format tables with predefined designs, including colors, borders, shading, and text alignments.","o":{"a":"Shapes","b":"Theme Colors","c":"Fill Effects","d":"Table Styles"},"a":"d","e":"Table Styles تنسق الجدول بسرعة بتصاميم جاهزة تشمل الألوان والحدود والتظليل والمحاذاة. Shapes وFill Effects لا تنسق الجداول."},{"sec":"S3 · تدريبات","page":55,"n":"5","q":"Word offers several built-in table styles that make it easier to format the entire table at once","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word يوفر أنماط جداول جاهزة تنسق الجدول كله دفعة واحدة."},{"sec":"S3 · تدريبات","page":55,"n":"6","q":"In MS Word, you can customize shapes by modifying attributes such as color, size, style, and effects to enhance their appearance.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تقدر تعدل الأشكال في اللون والحجم والنمط والتأثيرات لتحسين مظهرها."},{"sec":"S3 · تدريبات","page":56,"n":"7","q":"MS Word helps visually present data and ideas","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Word يساعد على عرض البيانات والأفكار بصرياً (بالجداول والمخططات والأشكال وغيرها)."},{"sec":"S3 · تدريبات","page":56,"n":"8","q":"_____________ offers various pre-designed layouts that you can customize to fit your content, such as organizational charts, steps in a process, or relationships between concepts.","o":{"a":"SmartArt","b":"Table","c":"Chart","d":"Header"},"a":"a","e":"SmartArt يوفر تخطيطات جاهزة قابلة للتخصيص مثل المخططات التنظيمية وخطوات العملية والعلاقات بين المفاهيم. Table وChart وHeader لها استخدامات أخرى."},{"sec":"S3 · تدريبات","page":56,"n":"9","q":"When a new document is created, MS Word automatically applies default settings.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: عند إنشاء مستند جديد يطبق Word إعدادات افتراضية تلقائياً."},{"sec":"S3 · تدريبات","page":56,"n":"10","q":"In MS Word, the _____________ tab enables you to utilize the various formatting tools and features available to create professional- looking documents.","o":{"a":"Home","b":"Insert","c":"Review","d":"Design"},"a":"d","e":"تبويب Design يوفر أدوات وميزات التنسيق (مثل Themes) لعمل مستندات احترافية. Home للتنسيق الأساسي، وInsert للإدراج، وReview للمراجعة."},{"sec":"S3 · تدريبات","page":56,"n":"11","q":"In Word, Page Fill Effects include gradients, textures, patterns, or pictures.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: تأثيرات تعبئة الصفحة تشمل التدرجات والأنسجة والأنماط والصور."},{"sec":"S3 · تدريبات","page":57,"n":"12","q":"In MS Word the _____________ offers various tools such as Margins, Orientation, etc., for controlling the overall structure and design of your document.","o":{"a":"Home","b":"Layout","c":"Design","d":"View"},"a":"b","e":"تبويب Layout فيه أدوات مثل الهوامش والاتجاه للتحكم في بنية المستند وتصميمه العام. Home للتنسيق، وDesign للثيمات، وView للعرض."},{"sec":"S3 · تدريبات","page":57,"n":"13","q":"In Word, _____________ refer to the blank spaces around the edges of a document's page.","o":{"a":"margins","b":"footers","c":"charts","d":"columns"},"a":"a","e":"Margins (الهوامش) هي المسافات الفارغة حول حواف الصفحة. Footers تذييلات، وCharts مخططات، وColumns أعمدة."},{"sec":"S3 · تدريبات","page":57,"n":"14","q":"The ____________ command is used to set the margin sizes for the entire document or for a section of the document.","o":{"a":"Watermark","b":"SmartArt","c":"Picture","d":"Margins"},"a":"d","e":"أمر Margins يضبط أحجام الهوامش للمستند كله أو لقسم منه. Watermark وSmartArt وPicture لا تضبط الهوامش."},{"sec":"S3 · تدريبات","page":57,"n":"15","q":"In Word, there are three types of page orientation.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن اتجاه الصفحة نوعان فقط: Portrait (عمودي) وLandscape (أفقي)."},{"sec":"S3 · تدريبات","page":57,"n":"16","q":"The vertical layout of the page in which the height of the pages is more than its width is called:","o":{"a":"Portrait","b":"Landscape","c":"Column","d":"Style"},"a":"a","e":"Portrait هو الاتجاه العمودي الذي يكون فيه ارتفاع الصفحة أكبر من عرضها. Landscape أفقي."},{"sec":"S3 · تدريبات","page":58,"n":"17","q":"In MS Word, portrait is the default page orientation.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: الاتجاه الافتراضي في Word هو Portrait (عمودي)."},{"sec":"S3 · تدريبات","page":58,"n":"18","q":"The horizontal layout of the page in which the width of the pages is more than the height is called _____________","o":{"a":"Portrait","b":"Landscape","c":"Column","d":"Row _____________"},"a":"b","e":"Landscape هو الاتجاه الأفقي الذي يكون فيه عرض الصفحة أكبر من ارتفاعها. Portrait عمودي."},{"sec":"S3 · تدريبات","page":58,"n":"19","q":"In Microsoft Word, _____________ refers to the dimensions of the page on which your content is displayed and printed.","o":{"a":"page color","b":"column","c":"page size","d":"theme"},"a":"c","e":"Page size هو أبعاد الصفحة التي يُعرض عليها المحتوى ويُطبع. Page color لون، وColumn عمود، وTheme تصميم."},{"sec":"S3 · تدريبات","page":58,"n":"20","q":"In Word, you cannot adjust the paper size.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تغيّر حجم الورق في Word."},{"sec":"S3 · تدريبات","page":58,"n":"21","q":"In Microsoft Word, the Columns command allows you to arrange text into multiple columns","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: أمر Columns يرتب النص في عدة أعمدة."},{"sec":"S4 · تجميعات","page":60,"n":"1","q":"____________ are essential tools in academic writing, providing additional information, citations, and references to support the content of a document.","o":{"a":"Table of Contents","b":"Hyperlinks","c":"Comments","d":"Footnotes and Endnotes"},"a":"d","e":"Footnotes and Endnotes أدوات مهمة في الكتابة الأكاديمية لإضافة معلومات واستشهادات ومراجع تدعم المحتوى. TOC وHyperlinks وComments لها أدوار أخرى."},{"sec":"S4 · تجميعات","page":60,"n":"2","q":"A _____________ is additional information found at the bottom of the current page in a document.","o":{"a":"footnote","b":"bookmark","c":"translation","d":"Copilot"},"a":"a","e":"Footnote (الحاشية السفلية) معلومات إضافية تظهر أسفل الصفحة الحالية. Bookmark علامة مرجعية، وTranslation ترجمة، وCopilot مساعد ذكي."},{"sec":"S4 · تجميعات","page":60,"n":"3","q":"Endnotes are similar to footnotes but appear at the end of the document or at the end of a section.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Endnotes تشبه الحواشي لكنها تظهر في نهاية المستند أو القسم."},{"sec":"S4 · تجميعات","page":60,"n":"4","q":"In Word, ____________ lists the chapters, sections, or main divisions of a document along with their corresponding page numbers.","o":{"a":"Table","b":"Bookmark","c":"Table of Contents","d":"Hyperlink"},"a":"c","e":"Table of Contents (جدول المحتويات) يسرد الفصول والأقسام مع أرقام صفحاتها. Table جدول عادي، وBookmark وHyperlink للتنقل فقط."},{"sec":"S4 · تجميعات","page":60,"n":"5","q":"______________ is placed at the beginning of a book or document, outlining the sections within the work and the sequence in which they appear.","o":{"a":"Table","b":"Bookmark","c":"Table of Contents","d":"Hyperlink"},"a":"c","e":"جدول المحتويات (Table of Contents) يوضع في بداية الكتاب أو المستند ويبين الأقسام وترتيبها. Bookmark وHyperlink لا يلخصان الأقسام."},{"sec":"S4 · تجميعات","page":61,"n":"6","q":"_____________ allows readers to jump quickly to the sections without scrolling through the whole document.","o":{"a":"Comment","b":"Table of Contents","c":"Thesaurus","d":"Track Changes"},"a":"b","e":"جدول المحتويات يتيح للقارئ الانتقال السريع للأقسام بدون تمرير المستند كله. Comment ملاحظة، وThesaurus مرادفات، وTrack Changes لتتبع التعديلات."},{"sec":"S4 · تجميعات","page":61,"n":"7","q":"In Microsoft Word, the Update Table of Contents feature allows you to refresh and modify the contents of your TOC after changes have been made to your document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Update Table of Contents يحدّث الجدول بعد تغييرات المستند."},{"sec":"S4 · تجميعات","page":61,"n":"8","q":"In Word 2021, you cannot remove Table of Content from your document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تحذف جدول المحتويات من المستند."},{"sec":"S4 · تجميعات","page":61,"n":"9","q":"In Microsoft Word, a _____________ is a feature that allows users to mark a specific location or section within a document for easy navigation.","o":{"a":"header","b":"hyperlink","c":"table of contents","d":"bookmark"},"a":"d","e":"Bookmark (إشارة مرجعية) يعلّم موقعاً أو قسماً في المستند لتسهيل التنقل. Header رأس صفحة، وHyperlink رابط، وTOC قائمة أقسام."},{"sec":"S4 · تجميعات","page":61,"n":"10","q":"Bookmark allows you to quickly jump to a particular section without scrolling through the entire document.","o":{"a":"True","b":"False"},"a":"a","e":"العبارة صحيحة: Bookmark يتيح الانتقال السريع لقسم معين بدون تمرير المستند."},{"sec":"S4 · تجميعات","page":62,"n":"11","q":"A bookmark cannot be deleted from the document.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأنك تقدر تحذف الـBookmark من المستند."},{"sec":"S4 · تجميعات","page":62,"n":"12","q":"If a bookmark is no longer needed in your document, it will automatically be deleted.","o":{"a":"True","b":"False"},"a":"b","e":"العبارة خطأ لأن الـBookmark لا يُحذف تلقائياً إذا لم ت
